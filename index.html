<html lang="en">
<head>

  <meta property="og:title" content="Tap to fly" />
  <meta property="og:description" content="100 handcrafted stages, epic boss fights, low-gravity space physics, and full casual endless mode." />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #101626 0%, #060911 100%);
      font-family: 'Courier New', Courier, monospace, system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    #canvas-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 4px #000000;
      border-radius: 6px;
      overflow: hidden;
      background: #0f172a;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 400px;
      max-height: 97vh;
      aspect-ratio: 360 / 640;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      cursor: pointer;
    }

    .dev-score-title {
      font-size: 15px;
      font-weight: 900;
      color: #fde047;
      text-align: center;
      margin-bottom: 4px;
    }

    .dev-score-sub {
      font-size: 11px;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 12px;
    }

    .dev-field {
      margin-bottom: 10px;
    }

    .dev-field label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .dev-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .dev-btn {
      width: 100%;
      padding: 9px;
      border: 2px solid #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .dev-btn-apply { background: #2563eb; }
    .dev-btn-cancel { background: #ef4444; }
    .dev-btn-policy {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #0f766e;
      color: #ffffff;
      border: 2px solid #000000;
      padding: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 900;
    }

    #settings-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      z-index: 60;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #settings-modal.open {
      display: flex;
    }

    .settings-card {
      width: 100%;
      max-width: 310px;
      background: #0f172a;
      border: 3px solid #facc15;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
      padding: 16px;
      color: #f8fafc;
      font-family: 'Courier New', Courier, monospace;
    }

    .settings-slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
    }

    .settings-slider-row input[type="range"] {
      flex: 1;
      accent-color: #facc15;
      cursor: pointer;
    }
  </style>
</head>

    function generate100Stages() {
      const stages = [];
      for (let i = 1; i <= 100; i++) {
        const worldIdx = Math.floor((i - 1) / 10); // 0..9
        const subStage = ((i - 1) % 10) + 1;     // 1..10
        const w = WORLDS[worldIdx];
        const progress = (subStage - 1) / 9;     // 0.0 -> 1.0 within world

        let speed = 2.25 + worldIdx * 0.06 + progress * 0.16;
        let gap = 136 - worldIdx * 1.2 - Math.round(progress * 8);
        let targetScore = 10 + worldIdx * 2 + Math.floor(subStage * 0.8);
        let themeKey = w.themeKey;
        const worldParam = progress;

        if (w.id === 1) {
          gap = Math.round(142 - progress * 12);
          speed = 2.15 + progress * 0.25;
          targetScore = 10 + Math.floor(progress * 6);
        } else if (w.id === 2) {
          gap = Math.round(128 - progress * 10);
          speed = 2.28 + progress * 0.24;
        } else if (w.id === 3) {
          gap = Math.round(130 - progress * 10);
          speed = 2.30 + progress * 0.24;
        } else if (w.id === 4) {
          // Stages 31-40: Tilted / Angled Pipes <= 50 degrees
          gap = Math.round(138 - progress * 12);
          speed = 2.32 + progress * 0.26;
        } else if (w.id === 5) {
          gap = Math.round(136 - progress * 12);
          speed = 2.25 + progress * 0.26;
        } else if (w.id === 6) {
          gap = Math.round(134 - progress * 10);
          speed = 2.34 + progress * 0.24;
        } else if (w.id === 7) {
          gap = Math.round(128 - progress * 10);
          speed = 2.40 + progress * 0.28;
        } else if (w.id === 8) {
          gap = Math.round(124 - progress * 14);
          speed = 2.44 + progress * 0.28;
        } else if (w.id === 9) {
          gap = Math.round(128 - progress * 10);
          speed = 2.46 + progress * 0.28;
          if (subStage > 5) themeKey = 'inferno';
        } else if (w.id === 10) {
          // Stages 91-100: Pipe-free Final Boss Bird Battle!
          speed = 2.60 + progress * 0.35;
          targetScore = 20 + Math.round(progress * 25); // 20s -> 45s boss survival
          if (subStage >= 8) themeKey = 'apocalypse';
        }

        stages.push({
          id: i,
          worldId: w.id,
          subStage,
          tier: w.tier,
          targetScore,
          pipeSpeed: Number(speed.toFixed(2)),
          pipeGap: Math.max(108, gap),
          hazard: w.hazard,
          noPipes: w.noPipes,
          themeKey,
          worldParam
        });
      }
      return stages;
    }

    /**
     * =========================================================================
     * WEB AUDIO SYNTHESIZER (2013 RETRO + LASER BOSS + NUCLEAR BLAST)
     * =========================================================================
     */
    class SoundEngine2013 {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.muted = localStorage.getItem('flappy_muted') === 'true';
        const savedVol = parseFloat(localStorage.getItem('flappy_volume'));
        this.volume = Number.isFinite(savedVol) ? Math.max(0, Math.min(1, savedVol)) : 0.8;
        this.noiseBuffer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = this.muted ? 0 : this.volume;
            this.masterGain.connect(this.ctx.destination);
            this.generateNoiseBuffer();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      getOut() {
        return this.masterGain || this.ctx.destination;
      }

      setVolume(vol) {
        this.init();
        this.volume = Math.max(0, Math.min(1, vol));
        if (this.volume > 0 && this.muted) {
          this.muted = false;
          try { localStorage.setItem('flappy_muted', 'false'); } catch (e) {}
        }
        try { localStorage.setItem('flappy_volume', this.volume.toString()); } catch (e) {}
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);
        }
        return this.volume;
      }

      generateNoiseBuffer() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2.0;
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
      }

      toggleMute() {
        this.init();
        this.muted = !this.muted;
        try {
          localStorage.setItem('flappy_muted', this.muted);
        } catch (e) {}
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setValueAtTime(this.muted ? 0 : this.volume, this.ctx.currentTime);
        }
        return this.muted;
      }

      playWing() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (this.noiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.value = 3.8;
          filter.frequency.setValueAtTime(950, now);
          filter.frequency.exponentialRampToValueAtTime(240, now + 0.11);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.42, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.getOut());

          noise.start(now);
          noise.stop(now + 0.12);
        }

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);

        oscGain.gain.setValueAtTime(0.24, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(oscGain);
        oscGain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 0.09);
      }

      playPoint() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(987.77, now);
        gain1.gain.setValueAtTime(0.28, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc1.connect(gain1);
        gain1.connect(this.getOut());
        osc1.start(now);
        osc1.stop(now + 0.04);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1318.51, now + 0.035);
        gain2.gain.setValueAtTime(0.32, now + 0.035);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
        osc2.connect(gain2);
        gain2.connect(this.getOut());
        osc2.start(now + 0.035);
        osc2.stop(now + 0.20);
      }

      playHit() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);

        gain.gain.setValueAtTime(0.40, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

        osc.connect(gain);
        gain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 0.13);
      }

      playDie() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.28);

        gain.gain.setValueAtTime(0.30, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

        osc.connect(gain);
        gain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 0.28);
      }

      playLaserBeam() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.25);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 0.25);
      }

      playNuclearBlast() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        if (this.noiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.exponentialRampToValueAtTime(50, now + 2.5);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.getOut());

          noise.start(now);
          noise.stop(now + 2.8);
        }

        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 2.0);

        oscGain.gain.setValueAtTime(0.9, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

        osc.connect(oscGain);
        oscGain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 2.5);
      }

      playLevelClear() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [392, 523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = now + idx * 0.08;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.22, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.25);
          osc.connect(gain);
          gain.connect(this.getOut());
          osc.start(start);
          osc.stop(start + 0.25);
        });
      }

      playUnlock() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = now + idx * 0.07;
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.18, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
          osc.connect(gain);
          gain.connect(this.getOut());
          osc.start(start);
          osc.stop(start + 0.22);
        });
      }

      playCoin() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.06);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.connect(gain);
        gain.connect(this.getOut());
        osc.start(now);
        osc.stop(now + 0.28);
      }

      playFireworkBurst(delay = 0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.noiseBuffer) return;

        const start = this.ctx.currentTime + delay;
        // Whistle launch
        const osc = this.ctx.createOscillator();
        const oGain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(420, start);
        osc.frequency.exponentialRampToValueAtTime(1320, start + 0.18);
        oGain.gain.setValueAtTime(0.14, start);
        oGain.gain.exponentialRampToValueAtTime(0.001, start + 0.19);
        osc.connect(oGain);
        oGain.connect(this.getOut());
        osc.start(start);
        osc.stop(start + 0.19);

        // Boom burst
        const boom = this.ctx.createBufferSource();
        boom.buffer = this.noiseBuffer;
        const bFilter = this.ctx.createBiquadFilter();
        bFilter.type = 'lowpass';
        bFilter.frequency.setValueAtTime(950, start + 0.18);
        bFilter.frequency.exponentialRampToValueAtTime(110, start + 0.65);
        const bGain = this.ctx.createGain();
        bGain.gain.setValueAtTime(0.5, start + 0.18);
        bGain.gain.exponentialRampToValueAtTime(0.001, start + 0.65);
        boom.connect(bFilter);
        bFilter.connect(bGain);
        bGain.connect(this.getOut());
        boom.start(start + 0.18);
        boom.stop(start + 0.66);

        // Sparkling crackles
        for (let k = 0; k < 5; k++) {
          const cTime = start + 0.22 + k * 0.06 + Math.random() * 0.04;
          const crackle = this.ctx.createBufferSource();
          crackle.buffer = this.noiseBuffer;
          const cFilter = this.ctx.createBiquadFilter();
          cFilter.type = 'bandpass';
          cFilter.frequency.value = 2400 + Math.random() * 1400;
          cFilter.Q.value = 3.0;
          const cGain = this.ctx.createGain();
          cGain.gain.setValueAtTime(0.22, cTime);
          cGain.gain.exponentialRampToValueAtTime(0.001, cTime + 0.06);
          crackle.connect(cFilter);
          cFilter.connect(cGain);
          cGain.connect(this.getOut());
          crackle.start(cTime);
          crackle.stop(cTime + 0.065);
        }
      }

      playApplause(durationSec = 3.2) {
        if (this.muted) return;
        this.init();
        if (!this.ctx || !this.noiseBuffer) return;

        const base = this.ctx.currentTime;
        const clapCount = 46;
        for (let i = 0; i < clapCount; i++) {
          const t = base + Math.random() * durationSec;
          const envScale = (t - base < durationSec * 0.72) ? 1.0 : Math.max(0.2, 1 - ((t - base - durationSec * 0.72) / (durationSec * 0.28)));
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1050 + Math.random() * 900;
          filter.Q.value = 1.6;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.18 * envScale, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.getOut());
          src.start(t, Math.random() * 0.5, 0.06);
        }
      }

      playVictoryCelebration() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        this.playLevelClear();
        this.playApplause(3.4);
        this.playFireworkBurst(0.1);
        this.playFireworkBurst(0.65);
        this.playFireworkBurst(1.25);
        this.playFireworkBurst(1.9);
        this.playFireworkBurst(2.5);
      }
    }

    const sound = new SoundEngine2013();

    /**

    class FlappyGame {

        // One-time player progress & inventory reset

      loadCasualHighScore() {
        try {
          return parseInt(localStorage.getItem('flappy_casual_high_score'), 10) || 0;
        } catch (e) {
          return 0;
        }
      }

      saveCasualHighScore(score) {
        try {
          localStorage.setItem('flappy_casual_high_score', score.toString());
        } catch (e) {}
      }

      loadCoins() {
        try {
          return parseInt(localStorage.getItem('flappy_coins'), 10) || 0;
        } catch (e) {
          return 0;
        }
      }

      saveCoins(coins) {
        try {
          localStorage.setItem('flappy_coins', coins.toString());
        } catch (e) {}
      }

      loadOwnedBirds() {
        try {
          const raw = localStorage.getItem('flappy_owned_birds');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              if (!parsed.includes('sunny')) parsed.unshift('sunny');
              return parsed;
            }
          }
        } catch (e) {}
        return ['sunny'];
      }

      saveOwnedBirds() {
        try {
          localStorage.setItem('flappy_owned_birds', JSON.stringify(this.ownedBirds));
        } catch (e) {}
      }

      loadOwnedItems() {
        try {
          const raw = localStorage.getItem('flappy_owned_items');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {}
        return [];
      }

      saveOwnedItems() {
        try {
          localStorage.setItem('flappy_owned_items', JSON.stringify(this.ownedItems));
        } catch (e) {}
      }

      loadEquippedItems() {
        try {
          const raw = localStorage.getItem('flappy_equipped_items');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {}
        return {};
      }

      saveEquippedItems() {
        try {
          localStorage.setItem('flappy_equipped_items', JSON.stringify(this.equippedItems));
        } catch (e) {}
      }

      isItemOwned(item) {
        return this.ownedItems.includes(item.id);
      }

      isItemEquipped(item) {
        return this.equippedItems[item.slot] === item.id;
      }

      getNeonColor() {
        return NEON_COLORS[this.neonColorIndex % NEON_COLORS.length] || NEON_COLORS[0];
      }

      getShieldMaxHits() {
        if (this.equippedItems.defense === 'golden_shield') return 2;
        if (this.equippedItems.defense === 'shield') return 1;
        return 0;
      }

      getFreeCoinsAdRemainingMs() {
        try {
          const lastTs = parseInt(localStorage.getItem('flappy_free_coins_ad_ts'), 10) || 0;
          if (!lastTs) return 0;
          const elapsed = Date.now() - lastTs;
          return Math.max(0, AD_COOLDOWN_MS - elapsed);
        } catch (e) {
          return 0;
        }
      }

      formatCooldown(ms) {
        const totalMins = Math.ceil(ms / 60000);
        const hrs = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
      }

      getStageCoinReward(stageId) {
        const base = (stageId <= 20)
          ? 5
          : Math.round(5 + ((stageId - 20) / 80) * 95); // Ramps cleanly from 6 (Stage 21) up to 100 (Stage 100)
        // After completing Levels mode (Stage 100), reduce coin rewards on stage replays
        if (this.levelsCompleted) {
          return Math.max(2, Math.round(base * 0.4));
        }
        return base;
      }

      generateCasualCoinPipes() {
        // Distribute 40 coins across 1000 columns (1 coin per 25-column bucket)
        const set = new Set();
        for (let bucket = 0; bucket < 40; bucket++) {
          const offset = 1 + Math.floor(Math.random() * 24);
          const colIdx = bucket * 25 + offset;
          if (colIdx < 999) {
            set.add(colIdx);
          }
        }
        return set;
      }

      getCurrentStage() {
        return ALL_STAGES[this.selectedStageId - 1] || ALL_STAGES[0];
      }

      getCurrentTheme() {
        if (this.gameMode === 'casual') {
          return THEMES.day;
        }
        const st = this.getCurrentStage();
        return THEMES[st.themeKey] || THEMES.day;
      }

      getSelectedBird() {
        return BIRDS.find(b => b.id === this.selectedBirdId) || BIRDS[0];
      }

      isBirdOwned(bird) {
        return bird.price === 0 || this.ownedBirds.includes(bird.id);
      }

      generateStars() {
        const stars = [];
        for (let i = 0; i < 48; i++) {
          stars.push({
            x: Math.floor(Math.random() * V_WIDTH),
            y: Math.floor(Math.random() * (PLAYABLE_FLOOR - 120)),
            size: Math.random() > 0.8 ? 2 : 1,
            phase: Math.random() * Math.PI * 2
          });
        }
        return stars;
      }

        if (this.gameMode === 'levels' && st.hazard === 'boss_arena') {

          this.boss.attackTimer = 100;
          this.boss.chargePhase = 0;
          this.boss.featherTimer = 70;
          this.boss.secondTimer = 0;
        } else {
          this.boss.active = false;
        }

        this.currentState = startGame ? STATE.PLAYING : STATE.START;
        if (startGame) {
          this.flap();
        }
      }

      setupSettingsModal() {
        const modal = document.getElementById('settings-modal');
        const slider = document.getElementById('settingsVolumeSlider');
        const valLabel = document.getElementById('settingsVolumeVal');
        const muteBtn = document.getElementById('settingsMuteBtn');
        const closeBtn = document.getElementById('settingsCloseBtn');

        const syncUI = () => {
          const pct = Math.round((sound.muted ? 0 : sound.volume) * 100);
          slider.value = Math.round(sound.volume * 100);
          valLabel.textContent = `${pct}%`;
          muteBtn.textContent = sound.muted ? 'SOUND: OFF' : 'SOUND: ON';
          muteBtn.style.background = sound.muted ? '#64748b' : '#2563eb';
        };

        this.openSettingsModal = () => {
          this.isSettingsOpen = true;
          syncUI();
          modal.classList.add('open');
        };

        this.closeSettingsModal = () => {
          this.isSettingsOpen = false;
          modal.classList.remove('open');
        };

        slider.addEventListener('input', () => {
          const v = Math.max(0, Math.min(100, parseInt(slider.value, 10) || 0)) / 100;
          sound.setVolume(v);
          syncUI();
        });

        slider.addEventListener('change', () => {
          if (!sound.muted) sound.playPoint();
        });

        muteBtn.addEventListener('click', () => {
          sound.toggleMute();
          if (!sound.muted) sound.playPoint();
          syncUI();
        });

        closeBtn.addEventListener('click', () => {
          this.closeSettingsModal();
        });

        modal.addEventListener('pointerdown', (e) => {
          if (e.target === modal) this.closeSettingsModal();
        });
      }

      setupEventListeners() {
        const handleAction = (clientX, clientY) => {
          if (this.isSettingsOpen) return;
          sound.init();

          if (clientX !== undefined && clientY !== undefined) {
            const rect = this.canvas.getBoundingClientRect();
            const scaleX = V_WIDTH / rect.width;
            const scaleY = V_HEIGHT / rect.height;
            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            // 1. Modals (Bird & Items Shop or Stage Select)
            if (this.isWatchingAd) {
              return;
            }

            if (this.isLockerOpen) {
              const cb = this.buttons.modalClose;
              if (clickX >= cb.x - 10 && clickX <= cb.x + cb.width + 10 &&
                  clickY >= cb.y - 10 && clickY <= cb.y + cb.height + 10) {
                this.isLockerOpen = false;
                return;
              }

              // Shop Tab Switching: BIRDS vs ITEMS
              const tb = this.buttons.shopTabBirds;
              if (clickX >= tb.x && clickX <= tb.x + tb.width && clickY >= tb.y && clickY <= tb.y + tb.height) {
                this.shopTab = 'birds';
                this.lockerScrollY = 0;
                sound.playPoint();
                return;
              }
              const ti = this.buttons.shopTabItems;
              if (clickX >= ti.x && clickX <= ti.x + ti.width && clickY >= ti.y && clickY <= ti.y + ti.height) {
                this.shopTab = 'items';
                this.lockerScrollY = 0;
                sound.playPoint();
                return;
              }

              const modalX = 14;
              const modalY = 24;
              const modalW = V_WIDTH - 28;
              const modalH = V_HEIGHT - 48;
              const rx = modalX + modalW - 22;

              if (this.shopTab === 'birds') {
                const rowPitch = 68;
                const startListY = 114 - this.lockerScrollY;

                for (let i = 0; i < BIRDS.length; i++) {
                  const itemY = startListY + i * rowPitch;
                  if (itemY + 60 >= 110 && itemY <= modalY + modalH - 8) {
                    const bird = BIRDS[i];
                    if (this.isBirdOwned(bird)) {
                      // Owned birds: clicking the EQUIP button or card equips
                      if (clickX >= 22 && clickX <= V_WIDTH - 22 &&
                          clickY >= Math.max(110, itemY) && clickY <= Math.min(modalY + modalH - 8, itemY + 60)) {
                        this.selectedBirdId = bird.id;
                        localStorage.setItem('flappy_selected_bird', bird.id);
                        sound.playPoint();
                        return;
                      }
                    } else {
                      // Unowned birds: STRICTLY must click the Green/Red Buy button rectangle!
                      const btnW = 78;
                      const btnH = 30;
                      const btnX = rx - btnW;
                      const btnY = itemY + 15;
                      if (clickX >= btnX && clickX <= btnX + btnW &&
                          clickY >= Math.max(110, btnY) && clickY <= Math.min(modalY + modalH - 8, btnY + btnH)) {
                        if (this.coins >= bird.price) {
                          this.coins -= bird.price;
                          this.saveCoins(this.coins);
                          this.ownedBirds.push(bird.id);
                          this.saveOwnedBirds();
                          this.selectedBirdId = bird.id;
                          localStorage.setItem('flappy_selected_bird', bird.id);
                          this.triggerToast('BIRD PURCHASED!', `${bird.name} equipped!`, bird, true);
                        } else {
                          sound.playHit();
                          this.triggerToast('NEED MORE COINS!', `Need ${bird.price} coins (${this.coins} owned)`, bird, false);
                        }
                        return;
                      }
                    }
                  }
                }
              } else {
                // ITEMS TAB
                const rowPitch = 74;
                const startListY = 114 - this.lockerScrollY;

                for (let i = 0; i < SHOP_ITEMS.length; i++) {
                  const itemY = startListY + i * rowPitch;
                  if (itemY + 66 >= 110 && itemY <= modalY + modalH - 8) {
                    const item = SHOP_ITEMS[i];
                    if (!this.isItemOwned(item)) {
                      // Strict Green/Red button click to buy item
                      const btnW = 78;
                      const btnH = 30;
                      const btnX = rx - btnW;
                      const btnY = itemY + 18;
                      if (clickX >= btnX && clickX <= btnX + btnW &&
                          clickY >= Math.max(110, btnY) && clickY <= Math.min(modalY + modalH - 8, btnY + btnH)) {
                        if (this.coins >= item.price) {
                          this.coins -= item.price;
                          this.saveCoins(this.coins);
                          this.ownedItems.push(item.id);
                          this.saveOwnedItems();
                          this.equippedItems[item.slot] = item.id;
                          this.saveEquippedItems();
                          if (item.slot === 'defense') this.shieldHits = this.getShieldMaxHits();
                          this.triggerToast('ITEM PURCHASED!', `${item.name} equipped!`, this.getSelectedBird(), true);
                        } else {
                          sound.playHit();
                          this.triggerToast('NEED MORE COINS!', `Need ${item.price} coins (${this.coins} owned)`, null, false);
                        }
                        return;
                      }
                    } else if (item.id === 'neon_trail') {
                      // Owned Neon Light: Toggle ON/OFF button & COLOR (AD) button
                      const eqX = rx - 68, eqY = itemY + 8, eqW = 68, eqH = 22;
                      if (clickX >= eqX && clickX <= eqX + eqW &&
                          clickY >= Math.max(110, eqY) && clickY <= Math.min(modalY + modalH - 8, eqY + eqH)) {
                        if (this.isItemEquipped(item)) {
                          delete this.equippedItems[item.slot];
                        } else {
                          this.equippedItems[item.slot] = item.id;
                        }
                        this.saveEquippedItems();
                        sound.playPoint();
                        return;
                      }

                      const adX = rx - 88, adY = itemY + 35, adW = 88, adH = 23;
                      if (clickX >= adX && clickX <= adX + adW &&
                          clickY >= Math.max(110, adY) && clickY <= Math.min(modalY + modalH - 8, adY + adH)) {
                        sound.playPoint();
                        AdManager.showRewardedAd('neon_color', () => {
                          this.adPurpose = 'neon_color';
                          this.isWatchingAd = true;
                          this.adPlaybackTimer = 180; // 3s ad to switch Neon Light color
                        });
                        return;
                      }
                    } else {
                      // Standard Owned Item: Click Toggle Equip/Unequip button
                      const eqX = rx - 68, eqY = itemY + 18, eqW = 68, eqH = 28;
                      if (clickX >= eqX && clickX <= eqX + eqW &&
                          clickY >= Math.max(110, eqY) && clickY <= Math.min(modalY + modalH - 8, eqY + eqH)) {
                        if (this.isItemEquipped(item)) {
                          delete this.equippedItems[item.slot];
                          if (item.slot === 'defense') this.shieldHits = 0;
                        } else {
                          this.equippedItems[item.slot] = item.id;
                          if (item.slot === 'defense') this.shieldHits = this.getShieldMaxHits();
                        }
                        this.saveEquippedItems();
                        sound.playPoint();
                        return;
                      }
                    }
                  }
                }
              }

              if (clickX < 14 || clickX > V_WIDTH - 14 || clickY < 24 || clickY > V_HEIGHT - 24) {
                this.isLockerOpen = false;
              }
              return;
            }

            if (this.isStageSelectOpen) {
              const cb = this.buttons.modalClose;
              if (clickX >= cb.x - 10 && clickX <= cb.x + cb.width + 10 &&
                  clickY >= cb.y - 10 && clickY <= cb.y + cb.height + 10) {
                this.isStageSelectOpen = false;
                return;
              }

              // Stage grid clicks (5 columns x 20 rows)
              const modalY = 24;
              const startGridY = modalY + 70 - this.stageSelectScrollY;
              const colW = 54;
              const rowH = 46;

              for (let i = 0; i < ALL_STAGES.length; i++) {
                const col = i % 5;
                const row = Math.floor(i / 5);
                const cellX = 30 + col * colW;
                const cellY = startGridY + row * rowH;

                if (cellY >= modalY + 58 && cellY <= modalY + 540) {
                  if (clickX >= cellX && clickX <= cellX + 46 &&
                      clickY >= cellY && clickY <= cellY + 38) {
                    const stageNum = i + 1;
                    if (this.levelsCompleted || stageNum <= this.unlockedLevel) {
                      this.selectedStageId = stageNum;
                      this.gameMode = 'levels';
                      localStorage.setItem('flappy_selected_stage', stageNum.toString());
                      localStorage.setItem('flappy_game_mode', 'levels');
                      this.isStageSelectOpen = false;
                      sound.playPoint();
                    }
                    return;
                  }
                }
              }
              if (clickX < 14 || clickX > V_WIDTH - 14 || clickY < 24 || clickY > V_HEIGHT - 24) {
                this.isStageSelectOpen = false;
              }
              return;
            }

            // 2. Settings Gear Icon (Only outside active gameplay)
            if (this.currentState !== STATE.PLAYING && this.currentState !== STATE.CASUAL_WIN) {
              const sb = this.buttons.settingsBox;
              if (clickX >= sb.x && clickX <= sb.x + sb.width &&
                  clickY >= sb.y && clickY <= sb.y + sb.height) {
                this.openSettingsModal();
                sound.playPoint();
                return;
              }
            }

            // 3. Start Screen Clicks (ONLY Play button starts gameplay - clicking background does NOT start)
            if (this.currentState === STATE.START) {
              // Small Free Coins Rewarded Ad Box next to Coins Badge (+10 coins, 12h cooldown)
              const fcab = this.buttons.freeCoinsAdBtn;
              if (clickX >= fcab.x && clickX <= fcab.x + fcab.width &&
                  clickY >= fcab.y && clickY <= fcab.y + fcab.height) {
                const rem = this.getFreeCoinsAdRemainingMs();
                if (rem <= 0) {
                  sound.playPoint();
                  AdManager.showRewardedAd('free_coins', () => {
                    this.adPurpose = 'free_coins';
                    this.isWatchingAd = true;
                    this.adPlaybackTimer = 180;
                  });
                } else {
                  sound.playHit();
                  this.triggerToast('AD REWARD COOLDOWN', `Next +10 ad in ${this.formatCooldown(rem)}`, null, false);
                }
                return;
              }

              // Casual Tab
              const bCas = this.buttons.modeCasual;
              if (clickX >= bCas.x && clickX <= bCas.x + bCas.width &&
                  clickY >= bCas.y && clickY <= bCas.y + bCas.height) {
                this.gameMode = 'casual';
                localStorage.setItem('flappy_game_mode', 'casual');
                sound.playPoint();
                return;
              }

              // Levels Tab
              const bLvl = this.buttons.modeLevels;
              if (clickX >= bLvl.x && clickX <= bLvl.x + bLvl.width &&
                  clickY >= bLvl.y && clickY <= bLvl.y + bLvl.height) {
                this.gameMode = 'levels';
                localStorage.setItem('flappy_game_mode', 'levels');
                sound.playPoint();
                return;
              }

              // Stage Select Button (ONLY opens after completing all 100 stages!)
              if (this.gameMode === 'levels' && this.levelsCompleted) {
                const ssb = this.buttons.stageSelectBtn;
                if (clickX >= ssb.x && clickX <= ssb.x + ssb.width &&
                    clickY >= ssb.y && clickY <= ssb.y + ssb.height) {
                  this.isStageSelectOpen = true;
                  sound.playPoint();
                  return;
                }
              }

              // Emerald Green "play" Button (ONLY way to start playing from Start screen)
              const pb = this.buttons.playBtn;
              if (clickX >= pb.x && clickX <= pb.x + pb.width &&
                  clickY >= pb.y && clickY <= pb.y + pb.height) {
                this.resetGame(true);
                return;
              }

              // Bottom Start Screen Button 1: BIRDS Shop
              const bsb = this.buttons.birdsStartBtn;
              if (clickX >= bsb.x && clickX <= bsb.x + bsb.width &&
                  clickY >= bsb.y && clickY <= bsb.y + bsb.height) {
                this.shopTab = 'birds';
                this.lockerScrollY = 0;
                this.isLockerOpen = true;
                sound.playPoint();
                return;
              }

              // Bottom Start Screen Button 2: ITEM SHOP
              const isb = this.buttons.itemShopStartBtn;
              if (clickX >= isb.x && clickX <= isb.x + isb.width &&
                  clickY >= isb.y && clickY <= isb.y + isb.height) {
                this.shopTab = 'items';
                this.lockerScrollY = 0;
                this.isLockerOpen = true;
                sound.playPoint();
                return;
              }

              // Do NOT start when clicking background on Start screen
              return;
            }

            // 4. Game Over Screen Clicks
            if (this.currentState === STATE.GAMEOVER) {
              if (this.isWatchingAd) {
                return;
              }

              // 5-second Watch Ad Offer (active in BOTH casual AND levels modes!)
              if (this.casualAdOfferTimer > 0) {
                const wab = this.buttons.watchAdBtn;
                if (clickX >= wab.x && clickX <= wab.x + wab.width &&
                    clickY >= wab.y && clickY <= wab.y + wab.height) {
                  this.casualAdOfferTimer = 0;
                  sound.playPoint();
                  AdManager.showRewardedAd('revive', () => {
                    this.adPurpose = 'revive';
                    this.isWatchingAd = true;
                    this.adPlaybackTimer = 180; // 3 second ad simulation
                  });
                  return;
                }

                const sab = this.buttons.skipAdBtn;
                if (clickX >= sab.x && clickX <= sab.x + sab.width &&
                    clickY >= sab.y && clickY <= sab.y + sab.height) {
                  this.casualAdOfferTimer = 0;
                  sound.playPoint();
                  return;
                }
                return;
              }

              const rb = this.buttons.restart;
              if (clickX >= rb.x && clickX <= rb.x + rb.width &&
                  clickY >= rb.y && clickY <= rb.y + rb.height) {
                this.resetGame(true);
                return;
              }

              const mb = this.buttons.menuInOver;
              if (clickX >= mb.x && clickX <= mb.x + mb.width &&
                  clickY >= mb.y && clickY <= mb.y + mb.height) {
                this.currentState = STATE.START;
                this.resetGame(false);
                sound.playPoint();
                return;
              }

              const lb2 = this.buttons.lockerInOver;
              if (clickX >= lb2.x && clickX <= lb2.x + lb2.width &&
                  clickY >= lb2.y && clickY <= lb2.y + lb2.height) {
                this.isLockerOpen = true;
                return;
              }
            }

            // 5. Level Cleared Screen Clicks
            if (this.currentState === STATE.LEVEL_CLEARED) {
              const nBtn = this.buttons.nextLevelBtn;
              if (clickX >= nBtn.x && clickX <= nBtn.x + nBtn.width &&
                  clickY >= nBtn.y && clickY <= nBtn.y + nBtn.height) {
                if (this.selectedStageId < 100) {
                  this.selectedStageId++;
                  localStorage.setItem('flappy_selected_stage', this.selectedStageId.toString());
                }
                this.resetGame(true);
                return;
              }

              const mBtn = this.buttons.menuInCleared;
              if (clickX >= mBtn.x && clickX <= mBtn.x + mBtn.width &&
                  clickY >= mBtn.y && clickY <= mBtn.y + mBtn.height) {
                this.currentState = STATE.START;
                this.resetGame(false);
                sound.playPoint();
                return;
              }
            }

            // 6. Casual 1000 Victory Screen Clicks
            if (this.currentState === STATE.CASUAL_WIN) {
              const cwBtn = this.buttons.menuInCasualWin;
              if (clickX >= cwBtn.x && clickX <= cwBtn.x + cwBtn.width &&
                  clickY >= cwBtn.y && clickY <= cwBtn.y + cwBtn.height) {
                this.currentState = STATE.START;
                this.resetGame(false);
                sound.playPoint();
                return;
              }
              return;
            }

            // 7. Cinematic End Screen Click
            if (this.currentState === STATE.CINEMATIC_END) {
              this.currentState = STATE.START;
              this.resetGame(false);
              this.isStageSelectOpen = true;
              sound.playPoint();
              return;
            }
          }

          if (this.isLockerOpen || this.isStageSelectOpen) return;

          // Gameplay Action (Flap ONLY during active gameplay)
          if (this.currentState === STATE.PLAYING) {
            this.flap();
          }
        };

        this.canvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleAction(e.clientX, e.clientY);
        });

        // Wheel scroll for Modals
        this.canvas.addEventListener('wheel', (e) => {
          if (this.isLockerOpen) {
            e.preventDefault();
            const listH = (this.shopTab === 'items') ? (SHOP_ITEMS.length * 74) : (BIRDS.length * 68);
            const maxScroll = Math.max(0, listH - 472);
            this.lockerScrollY = Math.max(0, Math.min(this.lockerScrollY + e.deltaY * 0.7, maxScroll));
          } else if (this.isStageSelectOpen) {
            e.preventDefault();
            const maxScroll = Math.max(0, (20 - 9) * 46);
            this.stageSelectScrollY = Math.max(0, Math.min(this.stageSelectScrollY + e.deltaY * 0.7, maxScroll));
          }
        }, { passive: false });

        // Touch drag
        let touchStartY = 0;
        this.canvas.addEventListener('touchstart', (e) => {
          if ((this.isLockerOpen || this.isStageSelectOpen) && e.touches.length > 0) {
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: true });

        this.canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) {
            const dy = touchStartY - e.touches[0].clientY;
            touchStartY = e.touches[0].clientY;
            if (this.isLockerOpen) {
              const listH = (this.shopTab === 'items') ? (SHOP_ITEMS.length * 74) : (BIRDS.length * 68);
              const maxScroll = Math.max(0, listH - 472);
              this.lockerScrollY = Math.max(0, Math.min(this.lockerScrollY + dy, maxScroll));
            } else if (this.isStageSelectOpen) {
              const maxScroll = Math.max(0, (20 - 9) * 46);
              this.stageSelectScrollY = Math.max(0, Math.min(this.stageSelectScrollY + dy, maxScroll));
            }
          }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
          if (this.isSettingsOpen) {
            if (e.code === 'Escape') {
              e.preventDefault();
              this.closeSettingsModal();
            }
            return;
          }
          if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            e.preventDefault();
            if (this.currentState === STATE.PLAYING && !this.isLockerOpen && !this.isStageSelectOpen) {
              this.flap();
            }
          }
          if (e.code === 'KeyM') {
            sound.toggleMute();
          }
          if (e.code === 'KeyB') {
            this.isLockerOpen = !this.isLockerOpen;
          }
          if (e.code === 'KeyS') {
            if (this.gameMode === 'levels' && this.levelsCompleted) this.isStageSelectOpen = !this.isStageSelectOpen;
          }
          if (e.code === 'KeyC') {
            this.gameMode = this.gameMode === 'casual' ? 'levels' : 'casual';
            localStorage.setItem('flappy_game_mode', this.gameMode);
          }
          if (e.code === 'Escape') {
            this.isLockerOpen = false;
            this.isStageSelectOpen = false;
          }
        });
      }

      activateCasualMario() {
        this.pipes = [];
        this.collectibles = [];
        this.hazards = [];
        this.casualMario = {
          active: true,
          phase: 'emerging',
          pipeX: V_WIDTH - 76,
          pipeY: PLAYABLE_FLOOR - 84,
          x: V_WIDTH - 46,
          y: PLAYABLE_FLOOR - 32,
          vy: 1.5,
          throwTimer: 45,
          energy: 720,
          maxEnergy: 720,
          animTimer: 0
        };
      }

      flap() {
        if (this.bird.y < 0) return;
        const curStage = this.getCurrentStage();
        const bird = this.getSelectedBird();
        const jumpMod = (bird.perk && bird.perk.jumpMod) ? bird.perk.jumpMod : 1.0;

        // World 5: Space Zero-G Float & Subtle Drift
        if (this.gameMode === 'levels' && curStage.hazard === 'space_asteroids') {
          setTimeout(() => {
            this.bird.vy = (CONFIG.JUMP_STRENGTH * 0.74) * jumpMod;
            this.bird.squashX = 0.90;
            this.bird.squashY = 1.12;
            sound.playWing();
          }, 35);
        } else {
          this.bird.vy = CONFIG.JUMP_STRENGTH * jumpMod;
          this.bird.squashX = 0.86;
          this.bird.squashY = 1.18;
          sound.playWing();
        }

        for (let i = 0; i < 4; i++) {
          this.particles.push({
            x: this.bird.x - 10 + (Math.random() - 0.5) * 6,
            y: this.bird.y + (Math.random() - 0.5) * 6,
            vx: -1.8 - Math.random() * 1.5,
            vy: (Math.random() - 0.5) * 2,
            size: 3,
            alpha: 1,
            color: bird.colors.body
          });
        }
      }

      spawnPipe() {
        const curStage = this.getCurrentStage();
        // Casual Mode Score 999+ stops pipes for Super Mario Pipe Battle
        if (this.gameMode === 'casual' && (this.casualMario.active || this.score >= 999)) {
          return;
        }
        // Final Stages (World 10: 91-100) have NO pipes - pure Boss Bird duel!
        if (this.gameMode === 'levels' && curStage.noPipes) {
          return;
        }

        let gapSize = (this.gameMode === 'levels') ? curStage.pipeGap : CONFIG.PIPE_GAP;
        let movingV = false;
        let sineAmp = 0;
        let sinePhase = 0;
        let angle = 0;

        if (this.gameMode === 'casual') {
          this.casualPipeNumber++;
          if (this.score >= 900) {
            gapSize = 128;
            movingV = true; // Casual moving pipes begin at 900
          } else {
            gapSize = CONFIG.PIPE_GAP;
            movingV = false;
          }
        } else {
          this.pipeSpawnCounter++;
          if (curStage.hazard === 'moving_v') {
            movingV = true;
            sineAmp = 22 + Math.round(curStage.worldParam * 14);
            sinePhase = this.pipeSpawnCounter * 1.2;
          } else if (curStage.hazard === 'sine_maze') {
            movingV = true;
            sineAmp = 34 + Math.round(curStage.worldParam * 18);
            sinePhase = this.pipeSpawnCounter * 0.9;
          } else if (curStage.hazard === 'tilted_pipes') {
            // Stages 31-40: Tilted / Angled Pipes <= 50 degrees (24 deg -> 46 deg)
            const angleDeg = 24 + curStage.worldParam * 22;
            const sign = (this.pipeSpawnCounter % 2 === 0) ? 1 : -1;
            angle = sign * (angleDeg * Math.PI / 180);
          }
        }

        const minH = angle !== 0 ? 96 : CONFIG.PIPE_MIN_HEIGHT;
        const available = Math.max(20, PLAYABLE_FLOOR - gapSize - (minH * 2));
        const topPipeHeight = minH + Math.floor(Math.random() * available);
        const bottomPipeY = topPipeHeight + gapSize;
        const bottomPipeHeight = PLAYABLE_FLOOR - bottomPipeY;

        const pipeObj = {
          x: V_WIDTH + 24,
          baseTopHeight: topPipeHeight,
          baseBottomY: bottomPipeY,
          topHeight: topPipeHeight,
          bottomY: bottomPipeY,
          bottomHeight: bottomPipeHeight,
          gapSize: gapSize,
          width: CONFIG.PIPE_WIDTH,
          movingV: movingV,
          sineAmp: sineAmp,
          sinePhase: sinePhase,
          angle: angle,
          scored: false,
          piranha: null,
          laserGate: null
        };

        // World 6: Piranha Plants inside Classic Green Pipes
        if (this.gameMode === 'levels' && curStage.hazard === 'piranha_pipes') {
          pipeObj.forceClassicGreen = true;
          pipeObj.piranha = {
            onTop: (this.pipeSpawnCounter % 2 === 0),
            phase: this.pipeSpawnCounter * 1.4,
            speed: 0.05 + curStage.worldParam * 0.025,
            ext: 0,
            maxExt: 38
          };
        }

        // Casual Mode (Score 700 - 998): Mario Piranha Flowers emerging from Pipes (replaces rockets!)
        if (this.gameMode === 'casual' && this.score >= 700 && this.score < 999) {
          const spawnFlower = (this.score >= 900) || (this.casualPipeNumber % 2 === 0);
          if (spawnFlower) {
            pipeObj.forceClassicGreen = true;
            pipeObj.piranha = {
              onTop: (this.casualPipeNumber % 2 === 0),
              phase: this.casualPipeNumber * 1.35,
              speed: 0.055,
              ext: 0,
              maxExt: 34
            };
          }
        }

        // World 9: Timer-Based Energy Laser Gates
        if (this.gameMode === 'levels' && curStage.hazard === 'laser_gates') {
          pipeObj.laserGate = {
            offset: this.pipeSpawnCounter * 42,
            cycle: 165,
            warnAt: 75,
            fireAt: 105,
            state: 'safe'
          };
        }

        // Casual Mode: 40 coins distributed across 1000 columns
        if (this.gameMode === 'casual' && this.casualCoinPipes.has(this.casualPipeNumber) && this.casualPipeNumber < 999) {
          this.collectibles.push({
            x: pipeObj.x + pipeObj.width / 2,
            y: topPipeHeight + gapSize / 2,
            radius: 11,
            pipeRef: pipeObj
          });
        }

        this.pipes.push(pipeObj);
      }

      absorbEnemyWithShield(reasonText = 'SHIELD BLOCK!') {
        if (this.shieldHits <= 0) return false;
        this.shieldHits--;
        this.invincibleTimer = 75;
        this.shakeTimer = 10;
        this.shakeIntensity = 5;
        sound.playPoint();
        const label = (this.shieldHits > 0) ? `${reasonText} (${this.shieldHits} LEFT)` : reasonText;
        this.floatingTexts.push({ x: this.bird.x, y: this.bird.y - 22, text: label, alpha: 1, vy: -1.3 });
        const shieldSparkCol = (this.equippedItems.defense === 'golden_shield') ? '#facc15' : '#38bdf8';
        for (let k = 0; k < 16; k++) {
          const ang = (Math.PI * 2 * k) / 16;
          this.particles.push({
            x: this.bird.x,
            y: this.bird.y,
            vx: Math.cos(ang) * 3.5,
            vy: Math.sin(ang) * 3.5,
            size: 3,
            alpha: 1,
            color: shieldSparkCol
          });
        }
        return true;
      }

      circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
        const closestX = Math.max(rx, Math.min(cx, rx + rw));
        const closestY = Math.max(ry, Math.min(cy, ry + rh));
        const dx = cx - closestX;
        const dy = cy - closestY;
        return (dx * dx + dy * dy) < (r * r);
      }

      triggerCrash() {
        if (this.currentState === STATE.GAMEOVER ||
            this.currentState === STATE.LEVEL_CLEARED ||
            this.currentState === STATE.CINEMATIC_END ||
            this.currentState === STATE.CASUAL_WIN) return;
        if (this.invincibleTimer > 0) return;

        this.currentState = STATE.GAMEOVER;
        this.shakeTimer = 18;
        this.shakeIntensity = 8;
        this.flashAlpha = 0.8;
        sound.playHit();
        setTimeout(() => sound.playDie(), 130);

        if (this.gameMode === 'casual') {
          if (Math.min(1000, this.score) > this.casualHighScore) {
            this.casualHighScore = Math.min(1000, this.score);
            this.saveCasualHighScore(this.casualHighScore);
            this.newHighScoreAchieved = true;
          }
        }

        // Show 5-second Watch Ad option in BOTH Casual and Levels modes if not yet used this run
        if (!this.usedAdRevive) {
          this.casualAdOfferTimer = 300; // 5 seconds at 60 FPS
        }

        const curBird = this.getSelectedBird();
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + Math.random() * 4.5;
          this.particles.push({
            x: this.bird.x,
            y: this.bird.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3,
            alpha: 1,
            color: [curBird.colors.body, curBird.colors.wing, '#ffffff', '#ef4444'][Math.floor(Math.random() * 4)]
          });
        }
      }

      triggerLevelCleared() {
        const curStage = this.getCurrentStage();

        if (curStage.id === 100) {
          this.triggerNuclearClimax();
          return;
        }

        const coinReward = this.getStageCoinReward(curStage.id);
        this.lastCoinReward = coinReward;
        this.coins += coinReward;
        this.saveCoins(this.coins);

        this.currentState = STATE.LEVEL_CLEARED;
        sound.playLevelClear();
        this.spawnConfetti();

        if (this.selectedStageId + 1 > this.unlockedLevel) {
          this.unlockedLevel = Math.min(100, this.selectedStageId + 1);
          localStorage.setItem('flappy_unlocked_level', this.unlockedLevel.toString());
        }
      }

      triggerNuclearClimax() {
        this.currentState = STATE.CINEMATIC_END;
        sound.playVictoryCelebration();
        this.flashAlpha = 1.0;
        this.shakeTimer = 45;
        this.shakeIntensity = 18;
        this.spawnConfetti();

        const reward = this.getStageCoinReward(100);
        this.lastCoinReward = reward;
        this.coins += reward;
        this.saveCoins(this.coins);

        this.levelsCompleted = true;
        localStorage.setItem('flappy_levels_completed', 'true');
        this.unlockedLevel = 100;
        localStorage.setItem('flappy_unlocked_level', '100');
      }

      triggerCasualWin() {
        if (this.currentState === STATE.CASUAL_WIN) return;
        this.score = 1000;
        this.displayedScore = 1000;
        if (1000 > this.casualHighScore) {
          this.casualHighScore = 1000;
          this.saveCasualHighScore(1000);
        }
        this.casualMario.active = false;
        this.pipes = [];
        this.hazards = [];
        this.collectibles = [];
        this.lastCoinReward = 100;
        this.coins += 100;
        this.saveCoins(this.coins);
        this.currentState = STATE.CASUAL_WIN;
        this.flashAlpha = 1.0;
        sound.playVictoryCelebration();
        this.spawnConfetti();
      }

      spawnConfetti() {
        const colors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ffffff'];
        for (let i = 0; i < 75; i++) {
          this.confetti.push({
            x: V_WIDTH / 2 + (Math.random() - 0.5) * 200,
            y: 160 + (Math.random() - 0.5) * 60,
            vx: (Math.random() - 0.5) * 7,
            vy: -4 - Math.random() * 5.5,
            size: 4 + Math.floor(Math.random() * 4),
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 12,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1
          });
        }
      }

      update() {
        if (this.isSettingsOpen) return;
        this.frameCount++;

        // Handle 3-second Ad Playback globally (Game Over Revive, Neon Color Switch, and Free +10 Coins)
        if (this.isWatchingAd) {
          this.adPlaybackTimer--;
          if (this.adPlaybackTimer <= 0) {
            this.isWatchingAd = false;
            if (this.adPurpose === 'neon_color') {
              this.neonColorIndex = (this.neonColorIndex + 1) % NEON_COLORS.length;
              localStorage.setItem('flappy_neon_color', this.neonColorIndex.toString());
              this.equippedItems.neon = 'neon_trail';
              this.saveEquippedItems();
              const nc = this.getNeonColor();
              this.triggerToast('NEON COLOR CHANGED!', `Color set to ${nc.name}`, this.getSelectedBird(), true);
            } else if (this.adPurpose === 'free_coins') {
              this.coins += 10;
              this.saveCoins(this.coins);
              try {
                localStorage.setItem('flappy_free_coins_ad_ts', Date.now().toString());
              } catch (e) {}
              sound.playCoin();
              this.triggerToast('FREE COINS CLAIMED!', '+10 Coins added! Next in 12h', this.getSelectedBird(), false);
            } else {
              this.usedAdRevive = true;
              this.invincibleTimer = 110;
              this.pipes = this.pipes.filter(p => p.x > V_WIDTH * 0.72);
              this.hazards = [];
              if (this.boss.active) {
                this.boss.x = Math.max(V_WIDTH - 62, this.boss.x);
                this.boss.chargePhase = 0;
                this.boss.attackTimer = 90;
              }
              this.bird.x = 95;
              this.bird.y = 250;
              this.bird.vy = 0;
              this.bird.rotation = 0;
              this.currentState = STATE.PLAYING;
              sound.playUnlock();
              this.floatingTexts.push({ x: this.bird.x, y: this.bird.y - 20, text: 'REVIVED!', alpha: 1, vy: -1.0 });
            }
          }
          return;
        }

        const curStage = this.getCurrentStage();
        const casualSpeed = CONFIG.BASE_PIPE_SPEED + (this.score >= 900 ? 0.55 : Math.min(0.45, this.score * 0.0005));
        const currentSpeed = (this.gameMode === 'levels') ? curStage.pipeSpeed : casualSpeed;
        const curBird = this.getSelectedBird();

        if (this.currentState !== STATE.GAMEOVER &&
            this.currentState !== STATE.LEVEL_CLEARED &&
            this.currentState !== STATE.CINEMATIC_END &&
            this.currentState !== STATE.CASUAL_WIN) {
          // Exact 32px ground pattern modulo & 310px city skyline modulo for zero wrap-around jumps!
          this.groundOffset = (this.groundOffset + currentSpeed) % 32;
          this.cityOffset = (this.cityOffset + currentSpeed * 0.22) % 310;
          this.cloudOffset = (this.cloudOffset + currentSpeed * 0.42) % 480;
        }

        // Neon Flight Light Trail Particles (Start screen & Playing)
        if (this.equippedItems.neon === 'neon_trail' &&
            (this.currentState === STATE.PLAYING || this.currentState === STATE.START) &&
            this.frameCount % 2 === 0) {
          const nc = this.getNeonColor();
          const bx = (this.currentState === STATE.START) ? (V_WIDTH / 2) : this.bird.x;
          const by = (this.currentState === STATE.START) ? (320 + Math.sin(this.frameCount * 0.08) * 8) : this.bird.y;
          this.particles.push({
            x: bx - 12,
            y: by + (Math.random() - 0.5) * 8,
            vx: -2.0,
            vy: (Math.random() - 0.5) * 0.6,
            size: 4,
            alpha: 0.9,
            color: nc.hex
          });
        }

        // Phoenix Aura Fire Sparks Particles (Start screen & Playing)
        if (this.equippedItems.aura === 'phoenix_aura' &&
            (this.currentState === STATE.PLAYING || this.currentState === STATE.START) &&
            this.frameCount % 3 === 0) {
          const bx = (this.currentState === STATE.START) ? (V_WIDTH / 2) : this.bird.x;
          const by = (this.currentState === STATE.START) ? (320 + Math.sin(this.frameCount * 0.08) * 8) : this.bird.y;
          this.particles.push({
            x: bx - 6 + (Math.random() - 0.5) * 14,
            y: by + (Math.random() - 0.5) * 12,
            vx: -1.6 - Math.random() * 0.8,
            vy: -0.9 - Math.random() * 0.7,
            size: 3,
            alpha: 0.95,
            color: Math.random() > 0.45 ? '#f97316' : '#facc15'
          });
        }

        if (this.shakeTimer > 0) {
          this.shakeTimer--;
          this.shakeIntensity *= 0.88;
        } else {
          this.shakeIntensity = 0;
        }

        if (this.flashAlpha > 0) {
          this.flashAlpha = Math.max(0, this.flashAlpha - 0.04);
        }

        if (this.lightningAlpha > 0) {
          this.lightningAlpha = Math.max(0, this.lightningAlpha - 0.032);
        }

        if (this.invincibleTimer > 0) {
          this.invincibleTimer--;
        }

        this.bird.squashX += (1 - this.bird.squashX) * 0.15;
        this.bird.squashY += (1 - this.bird.squashY) * 0.15;

        if (this.toast.active) {
          if (this.toast.timer > 0) {
            this.toast.timer--;
            this.toast.y += (this.toast.targetY - this.toast.y) * 0.15;
          } else {
            this.toast.y -= 4;
            if (this.toast.y < -100) {
              this.toast.active = false;
            }
          }
        }

        // STATE LOGIC
        if (this.currentState === STATE.START) {
          this.bird.y = 320 + Math.sin(this.frameCount * 0.08) * 8;
          this.bird.rotation = 0;
          this.bird.wingPhase = Math.sin(this.frameCount * 0.22);
        } else if (this.currentState === STATE.PLAYING) {
          // [TEMP DEV] Check if starting/edited score already reached target
          if (this.gameMode === 'levels' && this.score >= curStage.targetScore) {
            if (curStage.id === 100) {
              this.triggerNuclearClimax();
            } else {
              this.triggerLevelCleared();
            }
            return;
          }
          if (this.gameMode === 'casual') {
            if (this.score >= 1000) {
              this.triggerCasualWin();
              return;
            }
            if (this.score >= 999 && !this.casualMario.active) {
              this.activateCasualMario();
            }
          }

          // Physics
          let gravMod = (curBird.perk && curBird.perk.gravityMod) ? curBird.perk.gravityMod : 1.0;
          let termMod = (curBird.perk && curBird.perk.terminalMod) ? curBird.perk.terminalMod : 1.0;

          if (this.gameMode === 'levels' && curStage.hazard === 'space_asteroids') {
            gravMod *= 0.54;
            termMod *= 0.65;
          }

          const effectiveGravity = CONFIG.GRAVITY * gravMod;
          const effectiveTerminal = CONFIG.TERMINAL_VELOCITY * termMod;

          this.bird.vy = Math.min(this.bird.vy + effectiveGravity, effectiveTerminal);
          this.bird.y += this.bird.vy;

          // World 1: Gentle Horizontal Breeze + World 7: Strong Shifting Wind
          if (this.gameMode === 'levels' && curStage.hazard === 'wind_gentle') {
            const breeze = Math.sin(this.frameCount * 0.025 + curStage.id) * (0.22 + curStage.worldParam * 0.28);
            this.bird.x = Math.max(72, Math.min(126, 95 + Math.sin(this.frameCount * 0.018) * (14 + curStage.worldParam * 14)));
            this.bird.vy += breeze * 0.04;
            if (this.frameCount % 9 === 0) {
              this.particles.push({
                x: breeze >= 0 ? 0 : V_WIDTH,
                y: 40 + Math.random() * (PLAYABLE_FLOOR - 80),
                vx: breeze >= 0 ? 4.5 : -4.5,
                vy: 0.2,
                size: 2,
                alpha: 0.55,
                color: '#ffffff'
              });
            }
          } else if (this.gameMode === 'levels' && curStage.hazard === 'thunder_wind') {
            this.windFlipTimer--;
            if (this.windFlipTimer <= 0) {
              this.windDir *= -1;
              this.windFlipTimer = Math.max(130, 210 - Math.round(curStage.worldParam * 65));
            }
            const gustStrength = (0.45 + curStage.worldParam * 0.45) * this.windDir;
            this.bird.x = Math.max(60, Math.min(140, this.bird.x + gustStrength * 0.35));

            // Rain streaks
            if (this.frameCount % 2 === 0) {
              this.particles.push({
                x: Math.random() * V_WIDTH,
                y: 0,
                vx: gustStrength * 3.5,
                vy: 7.5,
                size: 2,
                alpha: 0.5,
                color: '#93c5fd'
              });
            }

            // Sudden Lightning Flash!
            this.lightningTimer--;
            if (this.lightningTimer <= 0) {
              this.lightningAlpha = 0.92;
              this.lightningTimer = Math.max(115, 195 - Math.round(curStage.worldParam * 60));
              sound.playHit();
            }
          } else {
            this.bird.x += (95 - this.bird.x) * 0.08;
          }

          if (this.bird.vy < 0) {
            this.bird.rotation = Math.max(this.bird.rotation - CONFIG.ROTATION_SPEED * 2, CONFIG.ROTATION_UP);
          } else {
            this.bird.rotation = Math.min(this.bird.rotation + CONFIG.ROTATION_SPEED * 0.8, CONFIG.ROTATION_DOWN);
          }

          this.bird.wingPhase = Math.sin(this.frameCount * 0.35);

          // Obstacle Spawning
          const canSpawnPipes = !(this.gameMode === 'casual' && (this.casualMario.active || this.score >= 999)) &&
                                !(this.gameMode === 'levels' && curStage.noPipes);
          if (canSpawnPipes) {
            const spawnInterval = (this.gameMode === 'casual')
              ? (this.score >= 900 ? 86 : CONFIG.PIPE_SPAWN_INTERVAL)
              : Math.max(80, Math.round(CONFIG.PIPE_SPAWN_INTERVAL - curStage.worldId * 1.6));
            this.spawnTimer++;
            if (this.spawnTimer >= spawnInterval) {
              this.spawnTimer = 0;
              this.spawnPipe();
            }
          }

          // World 5: Space Station Asteroids & Barriers
          if (this.gameMode === 'levels' && curStage.hazard === 'space_asteroids') {
            this.spaceHazardTimer--;
            if (this.spaceHazardTimer <= 0) {
              this.spaceHazardTimer = Math.max(68, 115 - Math.round(curStage.worldParam * 40));
              this.hazards.push({
                type: 'asteroid',
                x: V_WIDTH + 24,
                y: 55 + Math.random() * (PLAYABLE_FLOOR - 110),
                vx: -(2.8 + curStage.worldParam * 0.8),
                vy: (Math.random() - 0.5) * 1.1,
                width: 22,
                height: 22,
                rot: 0
              });
            }
          }

          // World 10 (Stages 91-100): Pipe-Free Final Boss Bird Battle!
          if (this.gameMode === 'levels' && curStage.hazard === 'boss_arena' && this.boss.active) {
            this.boss.secondTimer++;
            if (this.boss.secondTimer >= 60) {
              this.boss.secondTimer = 0;
              this.score++;
              sound.playPoint();
              if (this.score >= curStage.targetScore) {
                this.triggerLevelCleared();
                return;
              }
            }

            this.boss.attackTimer--;
            if (this.boss.attackTimer <= 0) {
              this.boss.chargePhase = 66; // Aggressive horizontal lunge toward player & back
              this.boss.attackTimer = Math.max(82, 145 - Math.round(curStage.worldParam * 55));
            }
            if (this.boss.chargePhase > 0) {
              this.boss.chargePhase--;
              const lungeOffset = Math.sin((1 - this.boss.chargePhase / 66) * Math.PI) * 185;
              this.boss.x = this.boss.baseX - lungeOffset;
            } else {
              this.boss.x += (this.boss.baseX - this.boss.x) * 0.08;
            }
            this.boss.y += (this.bird.y - this.boss.y) * (0.045 + curStage.worldParam * 0.03);

            // Boss body collision
            const br = CONFIG.BIRD_RADIUS - CONFIG.HITBOX_PADDING;
            if (this.bird.x + br > this.boss.x - 24 && this.bird.x - br < this.boss.x + 24 &&
                this.bird.y + br > this.boss.y - 20 && this.bird.y - br < this.boss.y + 20) {
              if (!this.absorbEnemyWithShield('SHIELD DEFLECT!')) {
                this.triggerCrash();
                return;
              }
            }

            // Sharp Feather Attack (Single or Spread Fan on higher stages)
            this.boss.featherTimer--;
            if (this.boss.featherTimer <= 0) {
              this.boss.featherTimer = Math.max(38, 78 - Math.round(curStage.worldParam * 32));
              const dy = this.bird.y - this.boss.y;
              const baseAngle = Math.atan2(dy, this.bird.x - this.boss.x);
              const fSpeed = 3.9 + curStage.worldParam * 1.1;
              const spreadOffsets = (curStage.worldParam >= 0.45) ? [-0.22, 0, 0.22] : [0];
              for (const off of spreadOffsets) {
                const a = baseAngle + off;
                this.hazards.push({
                  type: 'sharp_feather',
                  x: this.boss.x - 20,
                  y: this.boss.y - 4,
                  vx: Math.cos(a) * fSpeed,
                  vy: Math.sin(a) * fSpeed,
                  width: 18,
                  height: 8
                });
              }
              sound.playWing();
            }
          }

          // Casual 999: Mario Emerges from Green Pipe -> Fights until Energy Depleted -> Retreats into Pipe -> WIN!
          if (this.gameMode === 'casual' && this.casualMario.active) {
            const cm = this.casualMario;
            cm.animTimer++;

            if (cm.phase === 'emerging') {
              const targetY = cm.pipeY - 26;
              cm.x = cm.pipeX + 26;
              cm.y += (targetY - cm.y) * 0.08;
              if (Math.abs(cm.y - targetY) < 2 || cm.animTimer > 55) {
                cm.y = targetY;
                cm.phase = 'fighting';
                cm.animTimer = 0;
              }
            } else if (cm.phase === 'fighting') {
              cm.y += cm.vy;
              if (cm.y < 75) {
                cm.y = 75;
                cm.vy = Math.abs(cm.vy);
              } else if (cm.y > cm.pipeY - 22) {
                cm.y = cm.pipeY - 22;
                cm.vy = -Math.abs(cm.vy);
              }

              cm.throwTimer--;
              if (cm.throwTimer <= 0) {
                cm.throwTimer = 40 + Math.floor(Math.random() * 14);
                const dx = this.bird.x - (cm.x - 14);
                const dy = this.bird.y - cm.y;
                const dist = Math.max(1, Math.hypot(dx, dy));
                const speed = 3.5;
                this.hazards.push({
                  type: 'mario_ball',
                  x: cm.x - 18,
                  y: cm.y - 6,
                  vx: (dx / dist) * speed,
                  vy: (dy / dist) * speed,
                  width: 16,
                  height: 16,
                  rot: 0
                });
                sound.playWing();
              }

              cm.energy--;
              if (cm.energy <= 0) {
                cm.energy = 0;
                cm.phase = 'retreating';
                cm.animTimer = 0;
                this.hazards = []; // Clear balls as Mario gives up
                sound.playUnlock();
              }
            } else if (cm.phase === 'retreating') {
              // Mario slides back toward the pipe mouth and drops inside!
              const pipeTopX = cm.pipeX + 26;
              const insideY = cm.pipeY + 26;
              cm.x += (pipeTopX - cm.x) * 0.14;
              cm.y += (insideY - cm.y) * 0.08;
              if (cm.y >= cm.pipeY + 12 || cm.animTimer > 65) {
                this.triggerCasualWin();
                return;
              }
            }
          }

          // Update Pipes & Pipe-Attached Hazards (Piranha Plants, Laser Gates)
          for (let i = this.pipes.length - 1; i >= 0; i--) {
            const p = this.pipes[i];
            p.x -= currentSpeed;

            if (p.movingV) {
              const amp = p.sineAmp || 26;
              const freq = (this.gameMode === 'levels' && curStage.hazard === 'sine_maze') ? 0.065 : 0.045;
              const gap = p.gapSize || curStage.pipeGap;
              const oscillation = Math.sin(this.frameCount * freq + (p.sinePhase || p.baseTopHeight)) * amp;
              p.topHeight = Math.max(CONFIG.PIPE_MIN_HEIGHT, Math.min(p.baseTopHeight + oscillation, PLAYABLE_FLOOR - gap - 42));
              p.bottomY = p.topHeight + gap;
              p.bottomHeight = PLAYABLE_FLOOR - p.bottomY;
            }

            if (p.piranha) {
              const wave = Math.sin(this.frameCount * p.piranha.speed + p.piranha.phase);
              p.piranha.ext = Math.max(0, wave) * p.piranha.maxExt;
            }

            if (p.laserGate) {
              const tick = (this.frameCount + p.laserGate.offset) % p.laserGate.cycle;
              if (tick >= p.laserGate.fireAt) p.laserGate.state = 'active';
              else if (tick >= p.laserGate.warnAt) p.laserGate.state = 'warning';
              else p.laserGate.state = 'safe';
            }

            // Score point detection
            if (!p.scored && p.x + p.width < this.bird.x) {
              p.scored = true;
              this.score += 1;

              if (this.gameMode === 'casual') {
                if (this.score > 1000) this.score = 1000;
                if (this.score > this.casualHighScore) {
                  this.casualHighScore = this.score;
                  this.saveCasualHighScore(this.casualHighScore);
                }
              }

              sound.playPoint();

              this.floatingTexts.push({
                x: this.bird.x + 8,
                y: this.bird.y - 14,
                text: `+1`,
                alpha: 1,
                vy: -1.2
              });

              if (this.gameMode === 'casual' && this.score >= 999) {
                this.activateCasualMario();
                break;
              }

              if (this.gameMode === 'levels' && this.score >= curStage.targetScore) {
                this.triggerLevelCleared();
                return;
              }
            }

            if (p.x + p.width < -60) {
              this.pipes.splice(i, 1);
            }
          }

          // Update Collectible Coins (Casual Mode)
          for (let i = this.collectibles.length - 1; i >= 0; i--) {
            const c = this.collectibles[i];
            if (c.pipeRef) {
              c.x = c.pipeRef.x + c.pipeRef.width / 2;
              c.y = c.pipeRef.topHeight + (c.pipeRef.gapSize || 120) / 2;
            } else {
              c.x -= currentSpeed;
            }

            if (Math.hypot(this.bird.x - c.x, this.bird.y - c.y) < CONFIG.BIRD_RADIUS + c.radius + 4) {
              const coinAmt = 1 + ((curBird.perk && curBird.perk.coinBonus) ? curBird.perk.coinBonus : 0);
              this.coins += coinAmt;
              this.saveCoins(this.coins);
              sound.playCoin();

              this.floatingTexts.push({
                x: c.x,
                y: c.y - 12,
                text: `+${coinAmt} COIN`,
                alpha: 1,
