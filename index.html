      /**
       * Upgraded Shop Modal: [ BIRDS ] & [ ITEMS ] Tabs
       */
      renderBirdLocker(ctx) {
        ctx.save();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.82)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        const modalX = 14;
        const modalY = 24;
        const modalW = V_WIDTH - 28;
        const modalH = V_HEIGHT - 48;

        ctx.fillStyle = '#eed698';
        ctx.fillRect(modalX, modalY, modalW, modalH);
        ctx.strokeStyle = '#543812';
        ctx.lineWidth = 4;
        ctx.strokeRect(modalX, modalY, modalW, modalH);

        // Header
        ctx.fillStyle = '#543812';
        ctx.fillRect(modalX, modalY, modalW, 52);

        ctx.textAlign = 'center';
        ctx.font = '900 16px "Courier New", monospace';
        ctx.fillStyle = '#facc15';
        ctx.fillText(this.shopTab === 'birds' ? 'BIRD SHOP' : 'ITEMS SHOP', V_WIDTH / 2, modalY + 22);

        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(
          this.shopTab === 'birds'
            ? `COINS: ${this.coins}  ·  OWNED: ${this.ownedBirds.length}/${BIRDS.length}`
            : `COINS: ${this.coins}  ·  ITEMS: ${this.ownedItems.length}/${SHOP_ITEMS.length}`,
          V_WIDTH / 2, modalY + 41
        );

        // Close button
        const cb = this.buttons.modalClose;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(cb.x, cb.y, cb.width, cb.height);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(cb.x, cb.y, cb.width, cb.height);
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('✕', cb.x + cb.width / 2, cb.y + 22);

        // Tabs Row: [ BIRDS ] vs [ ITEMS ]
        const tb = this.buttons.shopTabBirds;
        const ti = this.buttons.shopTabItems;
        const isBirdsTab = (this.shopTab === 'birds');

        ctx.fillStyle = isBirdsTab ? '#2563eb' : '#94a3b8';
        ctx.fillRect(tb.x, tb.y, tb.width, tb.height);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(tb.x, tb.y, tb.width, tb.height);
        ctx.font = '900 12px "Courier New", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`BIRDS (${BIRDS.length})`, tb.x + tb.width / 2, tb.y + 18);

        ctx.fillStyle = !isBirdsTab ? '#16a34a' : '#94a3b8';
        ctx.fillRect(ti.x, ti.y, ti.width, ti.height);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(ti.x, ti.y, ti.width, ti.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`ITEMS (${SHOP_ITEMS.length})`, ti.x + ti.width / 2, ti.y + 18);

        // Scrollable Clip Area below Tabs (y = 110 .. modalY + modalH - 8)
        ctx.save();
        ctx.beginPath();
        ctx.rect(modalX + 6, 110, modalW - 12, modalY + modalH - 118);
        ctx.clip();

        const rx = modalX + modalW - 22;

        if (isBirdsTab) {
          const rarityColors = {
            Starter: '#64748b', Common: '#16a34a', Uncommon: '#0284c7',
            Rare: '#2563eb', Epic: '#9333ea', Legendary: '#d97706',
            Mythic: '#dc2626', Divine: '#db2777'
          };

          const rowPitch = 68;
          const startListY = 114 - this.lockerScrollY;

          BIRDS.forEach((b, idx) => {
            const rowY = startListY + idx * rowPitch;
            if (rowY + 60 < 108 || rowY > modalY + modalH) return;

            const isOwned = this.isBirdOwned(b);
            const isSelected = this.selectedBirdId === b.id;
            const canAfford = this.coins >= b.price;

            ctx.fillStyle = isSelected ? '#fef08a' : (isOwned ? '#ffffff' : (canAfford ? '#fffbeb' : '#e2e8f0'));
            ctx.fillRect(modalX + 10, rowY, modalW - 26, 60);
            ctx.strokeStyle = isSelected ? '#ca8a04' : (canAfford && !isOwned ? '#f59e0b' : '#cbd5e1');
            ctx.lineWidth = isSelected ? 3 : 1.5;
            ctx.strokeRect(modalX + 10, rowY, modalW - 26, 60);

            ctx.fillStyle = isOwned ? '#e0f2fe' : '#cbd5e1';
            ctx.fillRect(modalX + 16, rowY + 8, 42, 44);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1;
            ctx.strokeRect(modalX + 16, rowY + 8, 42, 44);

            this.renderPixelBird(ctx, modalX + 36, rowY + 30, 0, Math.sin(this.frameCount * 0.25 + idx), b, 0.85, 0.85, false);

            ctx.textAlign = 'left';
            ctx.font = '900 13px "Courier New", monospace';
            ctx.fillStyle = '#0f172a';
            ctx.fillText(b.name, modalX + 66, rowY + 20);

            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillStyle = rarityColors[b.rarity] || '#475569';
            ctx.fillText(b.rarity.toUpperCase(), modalX + 66, rowY + 33);

            ctx.font = '9px "Courier New", monospace';
            ctx.fillStyle = '#15803d';
            const shortDesc = b.perk.desc.length > 26 ? b.perk.desc.slice(0, 26) : b.perk.desc;
            ctx.fillText(shortDesc, modalX + 66, rowY + 49);

            ctx.textAlign = 'right';
            if (isSelected) {
              ctx.fillStyle = '#16a34a';
              ctx.font = '900 11px "Courier New", monospace';
              ctx.fillText('✓ EQUIPPED', rx, rowY + 34);
            } else if (isOwned) {
              ctx.fillStyle = '#2563eb';
              ctx.fillRect(rx - 64, rowY + 18, 64, 24);
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(rx - 64, rowY + 18, 64, 24);
              ctx.textAlign = 'center';
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 10px "Courier New", monospace';
              ctx.fillText('EQUIP', rx - 32, rowY + 34);
            } else {
              // Strict clickable Green/Red Purchase Box
              const btnW = 78;
              const btnH = 30;
              const btnX = rx - btnW;
              const btnY = rowY + 15;
              ctx.fillStyle = canAfford ? '#22c55e' : '#ef4444';
              ctx.fillRect(btnX, btnY, btnW, btnH);
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 2;
              ctx.strokeRect(btnX, btnY, btnW, btnH);

              this.drawPixelCoinIcon(ctx, btnX + 14, btnY + 15, 11);
              ctx.textAlign = 'right';
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 11px "Courier New", monospace';
              ctx.fillText(`${b.price}`, btnX + btnW - 7, btnY + 19);
            }
          });
        } else {
          // ITEMS TAB
          const rowPitch = 74;
          const startListY = 114 - this.lockerScrollY;

          SHOP_ITEMS.forEach((item, idx) => {
            const rowY = startListY + idx * rowPitch;
            if (rowY + 66 < 108 || rowY > modalY + modalH) return;

            const isOwned = this.isItemOwned(item);
            const isEq = this.isItemEquipped(item);
            const canAfford = this.coins >= item.price;

            ctx.fillStyle = isEq ? '#dcfce7' : (isOwned ? '#ffffff' : (canAfford ? '#fffbeb' : '#e2e8f0'));
            ctx.fillRect(modalX + 10, rowY, modalW - 26, 66);
            ctx.strokeStyle = isEq ? '#16a34a' : (canAfford && !isOwned ? '#f59e0b' : '#cbd5e1');
            ctx.lineWidth = isEq ? 3 : 1.5;
            ctx.strokeRect(modalX + 10, rowY, modalW - 26, 66);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(modalX + 16, rowY + 11, 42, 44);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1;
            ctx.strokeRect(modalX + 16, rowY + 11, 42, 44);
            this.renderShopItemIcon(ctx, modalX + 37, rowY + 33, item);

            ctx.textAlign = 'left';
            ctx.font = '900 12px "Courier New", monospace';
            ctx.fillStyle = '#0f172a';
            ctx.fillText(item.name, modalX + 65, rowY + 21);

            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.fillStyle = '#0284c7';
            ctx.fillText(`SLOT: ${item.slot.toUpperCase()}`, modalX + 65, rowY + 35);

            ctx.font = '9px "Courier New", monospace';
            ctx.fillStyle = '#475569';
            const shortDesc = item.desc.length > 23 ? item.desc.slice(0, 23) : item.desc;
            ctx.fillText(shortDesc, modalX + 65, rowY + 51);

            if (!isOwned) {
              const btnW = 78;
              const btnH = 30;
              const btnX = rx - btnW;
              const btnY = rowY + 18;
              ctx.fillStyle = canAfford ? '#22c55e' : '#ef4444';
              ctx.fillRect(btnX, btnY, btnW, btnH);
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 2;
              ctx.strokeRect(btnX, btnY, btnW, btnH);

              this.drawPixelCoinIcon(ctx, btnX + 14, btnY + 15, 11);
              ctx.textAlign = 'right';
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 11px "Courier New", monospace';
              ctx.fillText(`${item.price}`, btnX + btnW - 7, btnY + 19);
            } else if (item.id === 'neon_trail') {
              // Toggle ON/OFF button
              const eqX = rx - 68, eqY = rowY + 8, eqW = 68, eqH = 22;
              ctx.fillStyle = isEq ? '#16a34a' : '#2563eb';
              ctx.fillRect(eqX, eqY, eqW, eqH);
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(eqX, eqY, eqW, eqH);
              ctx.textAlign = 'center';
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 10px "Courier New", monospace';
              ctx.fillText(isEq ? '✓ ON' : 'EQUIP', eqX + eqW / 2, eqY + 15);

              // COLOR (AD) button to watch ad & change Neon Light color
              const adX = rx - 88, adY = rowY + 35, adW = 88, adH = 23;
              const nc = this.getNeonColor();
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(adX, adY, adW, adH);
              ctx.strokeStyle = nc.hex;
              ctx.lineWidth = 2;
              ctx.strokeRect(adX, adY, adW, adH);
              ctx.fillStyle = nc.hex;
              ctx.fillRect(adX + 5, adY + 6, 10, 11);
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 9px "Courier New", monospace';
              ctx.fillText('COLOR (AD)', adX + 52, adY + 15);
            } else {
              const eqX = rx - 68, eqY = rowY + 18, eqW = 68, eqH = 28;
              ctx.fillStyle = isEq ? '#16a34a' : '#2563eb';
              ctx.fillRect(eqX, eqY, eqW, eqH);
              ctx.strokeStyle = '#000000';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(eqX, eqY, eqW, eqH);
              ctx.textAlign = 'center';
              ctx.fillStyle = '#ffffff';
              ctx.font = '900 10px "Courier New", monospace';
              ctx.fillText(isEq ? '✓ ON' : 'EQUIP', eqX + eqW / 2, eqY + 18);
            }
          });
        }

        ctx.restore();

        const viewH = modalY + modalH - 118;
        const maxScroll = isBirdsTab
          ? Math.max(1, BIRDS.length * 68 - viewH)
          : Math.max(1, SHOP_ITEMS.length * 74 - viewH);
        const scrollRatio = Math.min(1, this.lockerScrollY / maxScroll);
        const trackY = 112;
        const trackH = viewH - 4;
        const thumbH = 34;
        const thumbY = trackY + scrollRatio * (trackH - thumbH);

        ctx.fillStyle = '#543812';
        ctx.fillRect(modalX + modalW - 10, thumbY, 5, thumbH);

        ctx.restore();
      }

      /**
       * 100-Stage Select Grid Modal (Numbers Only — NO Stage Names!)
       */
      renderStageSelectModal(ctx) {
        ctx.save();

        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        const modalX = 14;
        const modalY = 24;
        const modalW = V_WIDTH - 28;
        const modalH = V_HEIGHT - 48;

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(modalX, modalY, modalW, modalH);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.strokeRect(modalX, modalY, modalW, modalH);

        ctx.fillStyle = '#1e293b';
        ctx.fillRect(modalX, modalY, modalW, 54);

        ctx.textAlign = 'center';
        ctx.font = '900 15px "Courier New", monospace';
        ctx.fillStyle = '#fde047';
        ctx.fillText('SELECT STAGE (1 - 100)', V_WIDTH / 2, modalY + 24);

        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(this.levelsCompleted ? 'ALL 100 STAGES OPEN · PICK ANY' : `UNLOCKED: ${this.unlockedLevel}/100`, V_WIDTH / 2, modalY + 42);

        const cb = this.buttons.modalClose;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(cb.x, cb.y, cb.width, cb.height);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(cb.x, cb.y, cb.width, cb.height);
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('✕', cb.x + cb.width / 2, cb.y + 22);

        ctx.save();
        ctx.beginPath();
        ctx.rect(modalX + 6, modalY + 58, modalW - 12, modalH - 66);
        ctx.clip();

        const startGridY = modalY + 70 - this.stageSelectScrollY;
        const colW = 54;
        const rowH = 46;

        const worldAccentColors = [
          '#38bdf8', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4',
          '#22c55e', '#6366f1', '#ec4899', '#f43f5e', '#facc15'
        ];

        for (let i = 0; i < ALL_STAGES.length; i++) {
          const st = ALL_STAGES[i];
          const col = i % 5;
          const row = Math.floor(i / 5);
          const cellX = 30 + col * colW;
          const cellY = startGridY + row * rowH;
          const stageNum = i + 1;
          const isUnlocked = this.levelsCompleted || (stageNum <= this.unlockedLevel);
          const isCurrent = stageNum === this.selectedStageId;
          const wColor = worldAccentColors[st.worldId - 1] || '#94a3b8';

          ctx.fillStyle = isCurrent ? '#2563eb' : (isUnlocked ? '#1e293b' : '#090d16');
          ctx.fillRect(cellX, cellY, 46, 38);
          ctx.strokeStyle = isCurrent ? '#fde047' : (isUnlocked ? wColor : '#1e293b');
          ctx.lineWidth = isCurrent ? 2 : 1.5;
          ctx.strokeRect(cellX, cellY, 46, 38);

          ctx.textAlign = 'center';
          if (!isUnlocked) {
            ctx.font = '900 11px "Courier New", monospace';
            ctx.fillStyle = '#475569';
            ctx.fillText(stageNum.toString(), cellX + 23, cellY + 17);
            ctx.font = '9px sans-serif';
            ctx.fillText('🔒', cellX + 23, cellY + 31);
          } else {
            ctx.font = '900 14px "Courier New", monospace';
            ctx.fillStyle = isCurrent ? '#ffffff' : '#f8fafc';
            ctx.fillText(stageNum.toString(), cellX + 23, cellY + 24);
          }
        }

        ctx.restore();

        const maxScroll = Math.max(1, (20 - 9) * 46);
        const scrollRatio = this.stageSelectScrollY / maxScroll;
        const trackY = modalY + 60;
        const trackH = modalH - 70;
        const thumbH = 34;
        const thumbY = trackY + scrollRatio * (trackH - thumbH);

        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(modalX + modalW - 8, thumbY, 4, thumbH);

        ctx.restore();
      }
    }

    /**
     * =========================================================================
     * INITIALIZATION & FIXED 60 HZ APP RUNNER
     * =========================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      const gameApp = new FlappyBirdApp(canvas);
    });

    class FlappyBirdApp {
      constructor(canvas) {
        this.game = new FlappyGame(canvas);
        this.lastTime = performance.now();
        this.accumulator = 0;
        this.fixedStep = 1 / 60;
        this.tick = this.tick.bind(this);
        requestAnimationFrame(this.tick);
      }

      tick(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
        this.lastTime = timestamp;
        this.accumulator += dt;

        let steps = 0;
        while (this.accumulator >= this.fixedStep && steps < 3) {
          this.game.update();
          this.accumulator -= this.fixedStep;
          steps++;
        }

        this.game.render();
        requestAnimationFrame(this.tick);
      }
    }
  </script>
