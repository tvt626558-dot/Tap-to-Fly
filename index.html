                vy: -1.4
              });

              for (let k = 0; k < 8; k++) {
                const ang = (Math.PI * 2 * k) / 8;
                this.particles.push({
                  x: c.x,
                  y: c.y,
                  vx: Math.cos(ang) * 2.2,
                  vy: Math.sin(ang) * 2.2,
                  size: 3,
                  alpha: 1,
                  color: '#facc15'
                });
              }

              this.collectibles.splice(i, 1);
              continue;
            }

            if (c.x < -40) {
              this.collectibles.splice(i, 1);
            }
          }

          // Update Hazards
          const hitboxScale = (curBird.perk && curBird.perk.hitboxMod) ? curBird.perk.hitboxMod : 1.0;
          const birdRadius = (CONFIG.BIRD_RADIUS - CONFIG.HITBOX_PADDING) * hitboxScale;

          for (let i = this.hazards.length - 1; i >= 0; i--) {
            const h = this.hazards[i];

            if (h.type === 'asteroid') {
              h.x += h.vx;
              h.y += h.vy;
              h.rot += 0.08;
            } else if (h.type === 'sharp_feather' || h.type === 'mario_ball') {
              h.x += h.vx;
              h.y += h.vy;
              if (h.rot !== undefined) h.rot += 0.25;
            }

            const bx = this.bird.x;
            const by = this.bird.y;

            if (bx + birdRadius > h.x && bx - birdRadius < h.x + h.width &&
                by + birdRadius > h.y && by - birdRadius < h.y + h.height) {
              this.hazards.splice(i, 1);
              if (!this.absorbEnemyWithShield('SHIELD BLOCK!')) {
                this.triggerCrash();
                break;
              }
              continue;
            }

            if (h.x + h.width < -50 || h.y < -50 || h.y > V_HEIGHT + 50) {
              this.hazards.splice(i, 1);
            }
          }

          // Ceiling clamp
          if (this.bird.y - CONFIG.BIRD_RADIUS <= 0) {
            this.bird.y = CONFIG.BIRD_RADIUS;
            this.bird.vy = 0;
          }

          // Ground Collision
          if (this.bird.y + CONFIG.BIRD_RADIUS >= PLAYABLE_FLOOR) {
            this.bird.y = PLAYABLE_FLOOR - CONFIG.BIRD_RADIUS;
            this.triggerCrash();
          }

          // Pipe, Piranha & Laser Gate Collision (supports accurate Tilted Pipe local-space math!)
          const bx = this.bird.x;
          const by = this.bird.y;

          for (const p of this.pipes) {
            if (!p.angle) {
              if (bx + birdRadius > p.x && bx - birdRadius < p.x + p.width) {
                if (by - birdRadius < p.topHeight || by + birdRadius > p.bottomY) {
                  this.triggerCrash();
                  break;
                }
              }
            } else {
              // Transform bird center into top/bottom tilted pipe local coordinate space
              const pivX = p.x + p.width / 2;
              const cosA = Math.cos(-p.angle);
              const sinA = Math.sin(-p.angle);

              const tDx = bx - pivX;
              const tDy = by - p.topHeight;
              const tLx = tDx * cosA - tDy * sinA;
              const tLy = tDx * sinA + tDy * cosA;
              const hitTopBody = this.circleHitsRect(tLx, tLy, birdRadius, -p.width / 2, -650, p.width, 626);
              const hitTopLip = this.circleHitsRect(tLx, tLy, birdRadius, -p.width / 2 - 3, -24, p.width + 6, 24);

              const bDx = bx - pivX;
              const bDy = by - p.bottomY;
              const bLx = bDx * cosA - bDy * sinA;
              const bLy = bDx * sinA + bDy * cosA;
              const hitBotLip = this.circleHitsRect(bLx, bLy, birdRadius, -p.width / 2 - 3, 0, p.width + 6, 24);
              const hitBotBody = this.circleHitsRect(bLx, bLy, birdRadius, -p.width / 2, 24, p.width, 626);

              if (hitTopBody || hitTopLip || hitBotLip || hitBotBody) {
                this.triggerCrash();
                break;
              }
            }

            // Piranha Plant Collision (World 6 & Casual 700+)
            if (p.piranha && p.piranha.ext > 6) {
              const pCx = p.x + p.width / 2;
              const pW = 24;
              const pLeft = pCx - pW / 2;
              const pRight = pCx + pW / 2;
              const pTop = p.piranha.onTop ? p.topHeight : (p.bottomY - p.piranha.ext);
              const pBottom = p.piranha.onTop ? (p.topHeight + p.piranha.ext) : p.bottomY;
              if (bx + birdRadius > pLeft && bx - birdRadius < pRight &&
                  by + birdRadius > pTop && by - birdRadius < pBottom) {
                if (!this.absorbEnemyWithShield('SHIELD BLOCK!')) {
                  this.triggerCrash();
                  break;
                }
              }
            }

            // Active Laser Gate Collision (World 9)
            if (p.laserGate && p.laserGate.state === 'active') {
              const lCx = p.x + p.width / 2;
              if (bx + birdRadius > lCx - 5 && bx - birdRadius < lCx + 5 &&
                  by > p.topHeight && by < p.bottomY) {
                if (!this.absorbEnemyWithShield('SHIELD BLOCK!')) {
                  this.triggerCrash();
                  break;
                }
              }
            }
          }
        } else if (this.currentState === STATE.GAMEOVER ||
                   this.currentState === STATE.LEVEL_CLEARED ||
                   this.currentState === STATE.CASUAL_WIN ||
                   this.currentState === STATE.CINEMATIC_END) {
          if (this.currentState === STATE.GAMEOVER) {
            if (this.casualAdOfferTimer > 0) {
              this.casualAdOfferTimer--;
            }

            if (this.bird.y + CONFIG.BIRD_RADIUS < PLAYABLE_FLOOR) {
              this.bird.vy = Math.min(this.bird.vy + CONFIG.GRAVITY * 1.2, CONFIG.TERMINAL_VELOCITY);
              this.bird.y += this.bird.vy;
              this.bird.rotation = Math.min(this.bird.rotation + 0.15, CONFIG.ROTATION_DOWN);
            } else {
              this.bird.y = PLAYABLE_FLOOR - CONFIG.BIRD_RADIUS;
            }

            const targetY = 220;
            this.cardSlideY += (targetY - this.cardSlideY) * 0.12;

            if (this.displayedScore < this.score) {
              this.displayedScore += Math.max(1, Math.ceil((this.score - this.displayedScore) * 0.1));
            }
          }

          if ((this.currentState === STATE.CASUAL_WIN || this.currentState === STATE.CINEMATIC_END) &&
              this.frameCount % 48 === 0) {
            this.spawnConfetti();
          }

          for (let i = this.confetti.length - 1; i >= 0; i--) {
            const c = this.confetti[i];
            c.x += c.vx;
            c.y += c.vy;
            c.vy += 0.2;
            c.rotation += c.vRot;
            c.alpha -= 0.005;
            if (c.alpha <= 0 || c.y > V_HEIGHT) {
              this.confetti.splice(i, 1);
            }
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.alpha -= 0.04;
          if (pt.alpha <= 0) {
            this.particles.splice(i, 1);
          }
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y += ft.vy;
          ft.alpha -= 0.035;
          if (ft.alpha <= 0) {
            this.floatingTexts.splice(i, 1);
          }
        }
      }

      /**
       * =========================================================================
       * RENDER ENGINE - PIXEL ART & ATMOSPHERES
       * =========================================================================
       */
      render() {
        const ctx = this.ctx;
        const theme = this.getCurrentTheme();

        if (this.currentState === STATE.CASUAL_WIN) {
          this.renderCasualWinScreen(ctx);
          this.renderConfetti(ctx);
          if (this.flashAlpha > 0.01) {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.flashAlpha})`;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
          }
          if (this.isWatchingAd) {
            this.renderAdPlaybackOverlay(ctx);
          }
          return;
        }

        if (this.currentState === STATE.CINEMATIC_END) {
          this.renderCinematicEndScreen(ctx);
          this.renderConfetti(ctx);
          if (this.flashAlpha > 0.01) {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.flashAlpha})`;
            ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
          }
          if (this.isWatchingAd) {
            this.renderAdPlaybackOverlay(ctx);
          }
          return;
        }

        ctx.save();

        if (this.shakeIntensity > 0.1) {
          const sx = Math.floor((Math.random() - 0.5) * this.shakeIntensity);
          const sy = Math.floor((Math.random() - 0.5) * this.shakeIntensity);
          ctx.translate(sx, sy);
        }

        // Sky Background
        const skyGrad = ctx.createLinearGradient(0, 0, 0, PLAYABLE_FLOOR);
        skyGrad.addColorStop(0, theme.skyTop);
        skyGrad.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, V_WIDTH, PLAYABLE_FLOOR);

        if (theme.stars) {
          this.renderStars(ctx);
        }

        this.renderPixelCloud(ctx, theme);
        this.renderPixelCelestial(ctx, theme);
        this.renderPixelCityscape(ctx, theme);

        // Pipes & Collectible Coins
        this.renderPixelPipes(ctx, theme);
        this.renderCollectibles(ctx);

        // World 10: Final Battle Arena Boss Bird (Pipe-Free Survival)
        if (this.boss.active && this.currentState === STATE.PLAYING) {
          this.renderBossArenaBird(ctx);
        }

        // Casual 999: Super Mario Emerging from Green Pipe
        if (this.casualMario.active && this.currentState === STATE.PLAYING) {
          this.renderCasualMario(ctx);
        }

        // Hazards (Asteroids, Sharp Feathers, Mario Balls)
        this.renderHazards(ctx);

        if (this.gameMode === 'levels' && this.getCurrentStage().themeKey === 'apocalypse') {
          this.renderGroundFires(ctx);
        }

        this.renderParticles(ctx);

        // Bird
        const curBird = this.getSelectedBird();
        if (this.currentState === STATE.START) {
          const centerBirdX = V_WIDTH / 2;
          const centerBirdY = 320 + Math.sin(this.frameCount * 0.08) * 8;
          const idleWingPhase = Math.sin(this.frameCount * 0.22);
          const idleTilt = Math.sin(this.frameCount * 0.08) * 0.08;
          this.renderPixelBird(ctx, centerBirdX, centerBirdY, idleTilt, idleWingPhase, curBird, 1, 1, true);
        } else {
          const blinkHide = (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 4) % 2 === 0);
          if (blinkHide) {
            ctx.save();
            ctx.globalAlpha = 0.45;
            this.renderPixelBird(ctx, this.bird.x, this.bird.y, this.bird.rotation, this.bird.wingPhase, curBird, this.bird.squashX, this.bird.squashY, true);
            ctx.restore();
          } else {
            this.renderPixelBird(ctx, this.bird.x, this.bird.y, this.bird.rotation, this.bird.wingPhase, curBird, this.bird.squashX, this.bird.squashY, true);
          }
        }

        this.renderPixelGround(ctx, theme);

        // World 3: Deep Shadow Valley Spotlight Mask (+ Headlamp / Laser Goggles Forward Cone!)
        const curStage = this.getCurrentStage();
        if (this.gameMode === 'levels' && curStage.hazard === 'shadow_spotlight' && this.currentState === STATE.PLAYING) {
          if (!this.darknessCanvas) {
            this.darknessCanvas = document.createElement('canvas');
            this.darknessCanvas.width = V_WIDTH;
            this.darknessCanvas.height = V_HEIGHT;
            this.darknessCtx = this.darknessCanvas.getContext('2d');
          }
          const dctx = this.darknessCtx;
          const lightItem = this.equippedItems.light;
          const hasLaser = (lightItem === 'laser_goggles');
          const hasHeadlamp = (lightItem === 'headlamp' || hasLaser);
          const spotR = Math.round(122 - curStage.worldParam * 40) + (hasLaser ? 78 : (hasHeadlamp ? 44 : 0));

          dctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);
          dctx.globalCompositeOperation = 'source-over';
          dctx.fillStyle = 'rgba(2, 6, 23, 0.975)';
          dctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

          dctx.globalCompositeOperation = 'destination-out';
          const spotGrad = dctx.createRadialGradient(this.bird.x, this.bird.y, spotR * 0.35, this.bird.x, this.bird.y, spotR);
          spotGrad.addColorStop(0, 'rgba(0, 0, 0, 1)');
          spotGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.72)');
          spotGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          dctx.fillStyle = spotGrad;
          dctx.beginPath();
          dctx.arc(this.bird.x, this.bird.y, spotR, 0, Math.PI * 2);
          dctx.fill();

          if (hasHeadlamp) {
            const coneLen = hasLaser ? 228 : 178;
            const coneSpread = hasLaser ? 88 : 66;
            dctx.save();
            dctx.translate(this.bird.x, this.bird.y);
            dctx.rotate(this.bird.rotation * 0.65);
            const coneGrad = dctx.createLinearGradient(8, 0, coneLen, 0);
            coneGrad.addColorStop(0, 'rgba(0, 0, 0, 0.98)');
            coneGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.78)');
            coneGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            dctx.fillStyle = coneGrad;
            dctx.beginPath();
            dctx.moveTo(8, -8);
            dctx.lineTo(coneLen, -coneSpread);
            dctx.lineTo(coneLen, coneSpread);
            dctx.lineTo(8, 8);
            dctx.closePath();
            dctx.fill();
            dctx.restore();
          }

          ctx.drawImage(this.darknessCanvas, 0, 0);
        }

        // World 7: Thunderstorm Sudden Lightning Flash
        if (this.lightningAlpha > 0.01) {
          ctx.fillStyle = `rgba(224, 242, 254, ${this.lightningAlpha})`;
          ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        }

        this.renderFloatingTexts(ctx);
        this.renderConfetti(ctx);

        if (this.flashAlpha > 0.01) {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.flashAlpha})`;
          ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        }

        this.renderHUD(ctx, theme);
        this.renderAchievementToast(ctx);

        if (this.isLockerOpen) {
          this.renderBirdLocker(ctx);
        }
        if (this.isStageSelectOpen) {
          this.renderStageSelectModal(ctx);
        }
        if (this.isWatchingAd) {
          this.renderAdPlaybackOverlay(ctx);
        }

        ctx.restore();
      }

      renderStars(ctx) {
        ctx.save();
        for (const star of this.twinkleStars) {
          const alpha = 0.5 + Math.sin(this.frameCount * 0.06 + star.phase) * 0.4;
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
        ctx.restore();
      }

      renderPixelCloud(ctx, theme) {
        ctx.save();
        const cColor = theme.clouds || '#ffffff';
        const cShadow = theme.cloudShadow || 'rgba(0, 0, 0, 0.2)';
        const cloudDefs = [
          { baseX: 70, y: 74, scale: 1.0 },
          { baseX: 230, y: 112, scale: 0.78 },
          { baseX: 390, y: 66, scale: 0.88 }
        ];

        for (const cd of cloudDefs) {
          const cx = Math.floor((((cd.baseX - this.cloudOffset) % 480) + 480) % 480) - 80;
          const cy = cd.y;
          const s = cd.scale;

          ctx.fillStyle = cColor;
          ctx.fillRect(cx, cy, Math.round(62 * s), Math.round(10 * s));
          ctx.fillStyle = cShadow;
          ctx.fillRect(cx, cy + Math.round(7 * s), Math.round(62 * s), Math.round(3 * s));

          ctx.fillStyle = cColor;
          ctx.fillRect(cx + Math.round(8 * s), cy - Math.round(10 * s), Math.round(46 * s), Math.round(10 * s));
          ctx.fillStyle = cShadow;
          ctx.fillRect(cx + Math.round(8 * s), cy - Math.round(3 * s), Math.round(46 * s), Math.round(3 * s));

          ctx.fillStyle = cColor;
          ctx.fillRect(cx + Math.round(18 * s), cy - Math.round(17 * s), Math.round(26 * s), Math.round(7 * s));
        }

        ctx.restore();
      }

      renderPixelCelestial(ctx, theme) {
        ctx.save();
        const sm = theme.sunMoon || { type: 'sun', color: '#ffea2b', glow: 'rgba(255, 222, 0, 0.45)' };
        const cx = 258;
        const cy = 60;

        // Soft ambient celestial halo
        if (sm.glow) {
          const halo = ctx.createRadialGradient(cx + 18, cy + 18, 12, cx + 18, cy + 18, 44);
          halo.addColorStop(0, sm.glow);
          halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = halo;
          ctx.fillRect(cx - 28, cy - 28, 92, 92);
        }

        if (sm.type === 'sun' || sm.type === 'sunset_sun') {
          ctx.fillStyle = (sm.type === 'sunset_sun') ? '#c2410c' : '#ca8a04';
          ctx.fillRect(cx, cy, 36, 36);

          ctx.fillStyle = (sm.type === 'sunset_sun') ? '#7c2d12' : '#0284c7';
          ctx.fillRect(cx + 3, cy + 3, 30, 30);

          ctx.fillStyle = sm.color || '#ffde00';
          ctx.fillRect(cx + 8, cy + 8, 20, 20);

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(cx + 12, cy + 12, 6, 6);

          ctx.fillStyle = sm.color || '#ffde00';
          ctx.fillRect(cx + 16, cy + 4, 4, 3);
          ctx.fillRect(cx + 16, cy + 29, 4, 3);
          ctx.fillRect(cx + 4, cy + 16, 3, 4);
          ctx.fillRect(cx + 29, cy + 16, 3, 4);
        } else {
          ctx.fillStyle = '#9aa4b2';
          ctx.fillRect(cx, cy, 36, 36);

          ctx.fillStyle = '#0c1527';
          ctx.fillRect(cx + 3, cy + 3, 30, 30);

          ctx.fillStyle = sm.color || '#ffffff';
          ctx.fillRect(cx + 7, cy + 6, 16, 24);
          ctx.fillStyle = '#0c1527';
          ctx.fillRect(cx + 14, cy + 8, 14, 20);
        }

        ctx.restore();
      }

      renderPixelCityscape(ctx, theme) {
        ctx.save();
        const buildings = [
          { w: 26, h: 75 }, { w: 34, h: 105 }, { w: 22, h: 60 },
          { w: 38, h: 120 }, { w: 28, h: 85 }, { w: 26, h: 65 },
          { w: 40, h: 110 }, { w: 24, h: 70 }, { w: 36, h: 95 }
        ]; // Exact pattern width = 310px (matches this.cityOffset % 310 seamlessly!)

        let curX = -Math.floor(this.cityOffset % 310);
        const isDay = (theme.sunMoon && theme.sunMoon.type === 'sun');
        const winColor = isDay ? '#cffafe' : '#fde047';
        const winDimColor = isDay ? 'rgba(255,255,255,0.2)' : 'rgba(15,23,42,0.45)';

        while (curX < V_WIDTH + 60) {
          for (let bi = 0; bi < buildings.length; bi++) {
            const b = buildings[bi];
            ctx.fillStyle = theme.cityFar;
            ctx.fillRect(curX, PLAYABLE_FLOOR - b.h, b.w, b.h);
            // Rooftop trim highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.fillRect(curX, PLAYABLE_FLOOR - b.h, b.w, 2);

            // Deterministic periodic windows keyed strictly by `bi` (100% seamless wrap!)
            let row = 0;
            for (let wy = PLAYABLE_FLOOR - b.h + 12; wy < PLAYABLE_FLOOR - 14; wy += 16) {
              let col = 0;
              for (let relX = 6; relX < b.w - 6; relX += 10) {
                const winHash = (bi * 11 + row * 7 + col * 5) % 5;
                if (winHash === 1 || winHash === 3) {
                  ctx.fillStyle = winColor;
                  ctx.fillRect(curX + relX, wy, 4, 7);
                } else {
                  ctx.fillStyle = winDimColor;
                  ctx.fillRect(curX + relX, wy, 4, 7);
                }
                col++;
              }
              row++;
            }

            curX += b.w + 4;
          }
        }

        // Rolling Dark Silhouette Hill locked to exact 310px period for zero wrap-seam!
        ctx.fillStyle = theme.cityNear;
        ctx.beginPath();
        ctx.moveTo(-40, PLAYABLE_FLOOR);
        const periodRad = (Math.PI * 2) / 310;
        for (let x = -40; x <= V_WIDTH + 40; x += 12) {
          const hy = PLAYABLE_FLOOR - 17 - Math.sin((x + this.cityOffset) * periodRad) * 11;
          ctx.lineTo(x, Math.floor(hy));
        }
        ctx.lineTo(V_WIDTH + 40, PLAYABLE_FLOOR);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      renderPixelPipes(ctx, theme) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, V_WIDTH, PLAYABLE_FLOOR);
        ctx.clip();

        for (const p of this.pipes) {
          const px = Math.floor(p.x);
          const pw = p.width;
          const pTheme = p.forceClassicGreen ? THEMES.day : theme;

          // Piranha Plant emerging cleanly behind the green pipe lip (World 6 & Casual 700+)
          if (p.piranha && p.piranha.ext > 1) {
            const pCx = px + pw / 2;
            const ext = Math.floor(p.piranha.ext);
            const chomp = (Math.sin(this.frameCount * 0.25) > 0);
            ctx.save();
            ctx.fillStyle = '#15803d';
            if (p.piranha.onTop) {
              ctx.fillRect(pCx - 4, p.topHeight - 2, 8, Math.max(0, ext - 12));
              const headY = p.topHeight + ext - 18;
              ctx.fillStyle = '#000000';
              ctx.fillRect(pCx - 12, headY, 24, 18);
              ctx.fillStyle = '#dc2626';
              ctx.fillRect(pCx - 10, headY + 2, 20, 14);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(pCx - 7, headY + 4, 4, 4);
              ctx.fillRect(pCx + 3, headY + 5, 4, 4);
              const gapH = chomp ? 5 : 2;
              ctx.fillRect(pCx - 7, headY + 14 - gapH, 14, gapH);
            } else {
              ctx.fillRect(pCx - 4, p.bottomY - ext + 14, 8, Math.max(0, ext - 12));
              const headY = p.bottomY - ext;
              ctx.fillStyle = '#000000';
              ctx.fillRect(pCx - 12, headY, 24, 18);
              ctx.fillStyle = '#dc2626';
              ctx.fillRect(pCx - 10, headY + 2, 20, 14);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(pCx - 7, headY + 8, 4, 4);
              ctx.fillRect(pCx + 3, headY + 7, 4, 4);
              const gapH = chomp ? 5 : 2;
              ctx.fillRect(pCx - 7, headY + 2, 14, gapH);
            }
            ctx.restore();
          }

          if (!p.angle) {
            const topLipY = p.topHeight - 24;
            this.drawPixelPipeBody(ctx, px, 0, pw, topLipY, pTheme);
            this.drawPixelPipeLip(ctx, px - 3, topLipY, pw + 6, 24, false, pTheme);

            const botLipY = p.bottomY;
            this.drawPixelPipeLip(ctx, px - 3, botLipY, pw + 6, 24, true, pTheme);
            this.drawPixelPipeBody(ctx, px, botLipY + 24, pw, p.bottomHeight - 24, pTheme);
          } else {
            // World 4 (Stages 31-40): Tilted Pipes (<= 50 deg) with 626px full-span body so corners never clip!
            const pivX = px + pw / 2;

            ctx.save();
            ctx.translate(pivX, p.topHeight);
            ctx.rotate(p.angle);
            this.drawPixelPipeBody(ctx, -pw / 2, -650, pw, 626, pTheme);
            this.drawPixelPipeLip(ctx, -pw / 2 - 3, -24, pw + 6, 24, false, pTheme);
            ctx.restore();

            ctx.save();
            ctx.translate(pivX, p.bottomY);
            ctx.rotate(p.angle);
            this.drawPixelPipeLip(ctx, -pw / 2 - 3, 0, pw + 6, 24, true, pTheme);
            this.drawPixelPipeBody(ctx, -pw / 2, 24, pw, 626, pTheme);
            ctx.restore();
          }

          // World 9: Timer-Based Energy Laser Gate
          if (p.laserGate) {
            const lCx = px + pw / 2;
            const st = p.laserGate.state;
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(lCx - 7, p.topHeight - 4, 14, 7);
            ctx.fillRect(lCx - 7, p.bottomY - 3, 14, 7);
            ctx.fillStyle = (st === 'active') ? '#ef4444' : (st === 'warning' ? '#facc15' : '#22c55e');
            ctx.fillRect(lCx - 3, p.topHeight - 2, 6, 4);
            ctx.fillRect(lCx - 3, p.bottomY - 2, 6, 4);

            if (st === 'warning') {
              if (this.frameCount % 6 < 4) {
                ctx.fillStyle = 'rgba(250, 204, 21, 0.78)';
                ctx.fillRect(lCx - 1.5, p.topHeight + 3, 3, p.bottomY - p.topHeight - 6);
              }
            } else if (st === 'active') {
              ctx.fillStyle = 'rgba(239, 68, 68, 0.92)';
              ctx.fillRect(lCx - 5, p.topHeight + 2, 10, p.bottomY - p.topHeight - 4);
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(lCx - 2, p.topHeight + 2, 4, p.bottomY - p.topHeight - 4);
            }
          }
        }
        ctx.restore();
      }

      renderCollectibles(ctx) {
        if (!this.collectibles.length) return;
        ctx.save();
        for (const c of this.collectibles) {
          const cx = Math.floor(c.x);
          const cy = Math.floor(c.y);
          const wScale = 0.45 + 0.55 * Math.abs(Math.cos(this.frameCount * 0.12 + cx * 0.05));
          const w = Math.max(4, Math.round(16 * wScale));
          const h = 18;

          ctx.fillStyle = '#000000';
          ctx.fillRect(cx - w / 2 - 2, cy - h / 2, w + 4, h);
          ctx.fillRect(cx - w / 2, cy - h / 2 - 2, w, h + 4);

          ctx.fillStyle = '#facc15';
          ctx.fillRect(cx - w / 2, cy - h / 2, w, h);

          ctx.fillStyle = '#fef08a';
          ctx.fillRect(cx - w / 2 + 1, cy - h / 2 + 2, Math.max(2, Math.floor(w * 0.35)), h - 4);

          if (w >= 8) {
            ctx.fillStyle = '#b45309';
            ctx.fillRect(cx - 1, cy - 5, 2, 10);
          }
        }
        ctx.restore();
      }

      renderCasualMario(ctx) {
        ctx.save();
        const cm = this.casualMario;
        const px = Math.floor(cm.pipeX);
        const py = Math.floor(cm.pipeY);
        const pw = 52;

        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, V_WIDTH, (cm.phase === 'emerging' || cm.phase === 'retreating') ? py : PLAYABLE_FLOOR);
        ctx.clip();

        const mx = Math.floor(cm.x);
        const my = Math.floor(cm.y);

        // Red Cap
        ctx.fillStyle = '#000000';
        ctx.fillRect(mx - 12, my - 22, 22, 10);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(mx - 10, my - 20, 18, 7);
        ctx.fillRect(mx - 14, my - 15, 8, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(mx - 5, my - 19, 6, 4);

        // Face & Mustache
        ctx.fillStyle = '#fcd34d';
        ctx.fillRect(mx - 9, my - 12, 16, 11);
        ctx.fillStyle = '#000000';
        ctx.fillRect(mx - 7, my - 10, 3, 4);
        ctx.fillStyle = '#451a03';
        ctx.fillRect(mx - 11, my - 5, 9, 3);

        // Red Shirt & Blue Overalls
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(mx - 10, my - 1, 18, 8);
        ctx.fillStyle = '#2563eb';
        ctx.fillRect(mx - 9, my + 5, 16, 12);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(mx - 6, my + 6, 3, 3);
        ctx.fillRect(mx + 1, my + 6, 3, 3);

        // Throwing Arm
        const armRaise = (cm.throwTimer < 12) ? -6 : 0;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(mx - 16, my + 1 + armRaise, 6, 6);
        ctx.restore();

        // Classic Green Warp Pipe in Foreground on Right Side
        this.drawPixelPipeBody(ctx, px, py + 24, pw, PLAYABLE_FLOOR - (py + 24), THEMES.day);
        this.drawPixelPipeLip(ctx, px - 3, py, pw + 6, 24, true, THEMES.day);

        if (cm.phase === 'fighting') {
          const mx = Math.floor(cm.x);
          const my = Math.floor(cm.y);
          const ratio = Math.max(0, cm.energy / Math.max(1, cm.maxEnergy));
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(mx - 22, my - 34, 44, 7);
          ctx.fillStyle = ratio > 0.35 ? '#ef4444' : '#facc15';
          ctx.fillRect(mx - 21, my - 33, Math.floor(42 * ratio), 5);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          ctx.strokeRect(mx - 22, my - 34, 44, 7);
        }

        ctx.restore();
      }

      drawPixelPipeBody(ctx, x, y, width, height, theme) {
        if (height <= 0) return;
        const cols = theme.pipeGrad;

        ctx.fillStyle = theme.pipeOutline;
        ctx.fillRect(x, y, width, height);

        const innerX = x + 2;
        const innerW = width - 4;

        ctx.fillStyle = cols[1];
        ctx.fillRect(innerX, y, 6, height);
        ctx.fillStyle = cols[0];
        ctx.fillRect(innerX + 6, y, 14, height);
        ctx.fillStyle = cols[2];
        ctx.fillRect(innerX + 20, y, innerW - 32, height);
        ctx.fillStyle = cols[3];
        ctx.fillRect(innerX + innerW - 12, y, 8, height);
        ctx.fillStyle = cols[4];
        ctx.fillRect(innerX + innerW - 4, y, 4, height);

        // Crisp specular highlight stripe for improved arcade clarity
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(innerX + 8, y, 3, height);
      }

      drawPixelPipeLip(ctx, x, y, width, height, isBottom, theme) {
        const cols = theme.pipeGrad;

        ctx.fillStyle = theme.pipeOutline;
        ctx.fillRect(x + 2, y, width - 4, height);
        ctx.fillRect(x, y + 2, width, height - 4);

        const ix = x + 2;
        const iy = y + 2;
        const iw = width - 4;
        const ih = height - 4;

        ctx.fillStyle = cols[0];
        ctx.fillRect(ix, iy, iw, ih);
        ctx.fillStyle = cols[1];
        ctx.fillRect(ix + 2, iy, 8, ih);
        ctx.fillStyle = cols[3];
        ctx.fillRect(ix + iw - 12, iy, 8, ih);
        ctx.fillStyle = cols[4];
        ctx.fillRect(ix + iw - 4, iy, 4, ih);

        // Specular lip sheen + subtle inner rim shadow
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fillRect(ix + 11, iy + 2, 3, ih - 4);

        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        if (isBottom) {
          ctx.fillRect(ix, iy, iw, 4);
        } else {
          ctx.fillRect(ix, iy + ih - 4, iw, 4);
        }
      }

      renderBossArenaBird(ctx) {
        ctx.save();
        const b = this.boss;
        const bx = Math.floor(b.x);
        const by = Math.floor(b.y);
        const wingFlap = Math.sin(this.frameCount * 0.32) * 11;

        // Menacing Boss Aura & Telegraph Glow
        const auraR = b.chargePhase > 0 ? 48 : 38;
        const auraGrad = ctx.createRadialGradient(bx, by, 10, bx, by, auraR);
        auraGrad.addColorStop(0, b.chargePhase > 0 ? 'rgba(239, 68, 68, 0.55)' : 'rgba(220, 38, 38, 0.25)');
        auraGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = auraGrad;
        ctx.fillRect(bx - auraR, by - auraR, auraR * 2, auraR * 2);

        // Tail feathers
        ctx.fillStyle = '#000000';
        ctx.fillRect(bx + 22, by - 10, 14, 20);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(bx + 24, by - 7, 10, 6);
        ctx.fillRect(bx + 24, by + 1, 10, 6);

        // Dark Crimson Armored Body (facing left)
        ctx.fillStyle = '#000000';
        ctx.fillRect(bx - 28, by - 22, 56, 44);
        ctx.fillStyle = '#7f1d1d';
        ctx.fillRect(bx - 25, by - 19, 50, 38);
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(bx - 22, by - 16, 44, 22);
        // Armor chest plate
        ctx.fillStyle = '#334155';
        ctx.fillRect(bx - 20, by + 4, 34, 10);

        // Crown Spikes
        ctx.fillStyle = '#facc15';
        ctx.fillRect(bx - 12, by - 28, 6, 8);
        ctx.fillRect(bx - 2, by - 32, 6, 12);
        ctx.fillRect(bx + 8, by - 27, 6, 7);

        // Flapping Armored Wing
        ctx.fillStyle = '#000000';
        ctx.fillRect(bx - 2, by - 6 + wingFlap, 30, 18);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(bx + 1, by - 3 + wingFlap, 24, 12);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(bx + 4, by - 1 + wingFlap, 18, 4);

        // Glowing Angry Eye & Furrowed Brow (facing left)
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(bx - 21, by - 11, 10, 9);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(bx - 20, by - 8, 5, 5);
        ctx.fillStyle = '#000000';
        ctx.fillRect(bx - 23, by - 14, 14, 4);

        // Sharp Beak pointing Left
        ctx.fillStyle = '#f97316';
        ctx.fillRect(bx - 38, by - 2, 13, 9);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(bx - 36, by, 10, 4);

        ctx.restore();
      }

      renderHazards(ctx) {
        ctx.save();
        for (const h of this.hazards) {
          const hx = Math.floor(h.x);
          const hy = Math.floor(h.y);

          if (h.type === 'asteroid') {
            const cx = hx + h.width / 2;
            const cy = hy + h.height / 2;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(h.rot || 0);
            ctx.fillStyle = '#000000';
            ctx.fillRect(-11, -11, 22, 22);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(-9, -9, 18, 18);
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(-7, -7, 8, 8);
            ctx.fillStyle = '#334155';
            ctx.fillRect(1, 1, 6, 6);
            ctx.restore();
          } else if (h.type === 'sharp_feather') {
            const ang = Math.atan2(h.vy, h.vx);
            ctx.save();
            ctx.translate(hx + h.width / 2, hy + h.height / 2);
            ctx.rotate(ang);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
            ctx.fillRect(-14, -5, 10, 10);
            ctx.fillStyle = '#000000';
            ctx.fillRect(-10, -4, 20, 8);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-8, -2, 16, 4);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(2, -2, 6, 4);
            ctx.restore();
          } else if (h.type === 'mario_ball') {
            const cx = hx + 8;
            const cy = hy + 8;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(h.rot || 0);
            ctx.fillStyle = 'rgba(249, 115, 22, 0.35)';
            ctx.fillRect(-10, -10, 20, 20);
            ctx.fillStyle = '#000000';
            ctx.fillRect(-8, -8, 16, 16);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-6, -6, 12, 12);
            ctx.fillStyle = '#f97316';
            ctx.fillRect(-4, -4, 8, 8);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(-2, -2, 4, 4);
            ctx.restore();
          }
        }
        ctx.restore();
      }

      renderGroundFires(ctx) {
        ctx.save();
        ctx.fillStyle = '#ef4444';
        for (let x = 0; x < V_WIDTH; x += 18) {
          const fireH = 10 + Math.sin(this.frameCount * 0.3 + x) * 8;
          ctx.fillRect(x, PLAYABLE_FLOOR - fireH, 14, fireH);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(x + 3, PLAYABLE_FLOOR - fireH + 4, 8, fireH - 4);
          ctx.fillStyle = '#ef4444';
        }
        ctx.restore();
      }

      renderPixelBird(ctx, x, y, rotation, wingPhase, bird, squashX = 1, squashY = 1, showEquipped = true) {
        ctx.save();
        ctx.translate(Math.floor(x), Math.floor(y));
        ctx.rotate(rotation);
        ctx.scale(squashX, squashY);

        const P = 2.2;
        const c = bird.colors;
        const eq = showEquipped ? this.equippedItems : {};

        // Neon Flight Glow Aura
        if (eq.neon === 'neon_trail') {
          const nc = this.getNeonColor();
          ctx.save();
          ctx.globalAlpha = 0.32 + Math.sin(this.frameCount * 0.2) * 0.1;
          ctx.fillStyle = nc.hex;
          ctx.beginPath();
          ctx.arc(0, 0, 12 * P, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Headlamp Soft Forward Beam (always visible, brighter in dark)
        if (eq.light === 'headlamp') {
          ctx.save();
          const bGrad = ctx.createLinearGradient(5 * P, -5 * P, 42 * P, -5 * P);
          bGrad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
          bGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.moveTo(5 * P, -6 * P);
          ctx.lineTo(42 * P, -18 * P);
          ctx.lineTo(42 * P, 8 * P);
          ctx.lineTo(5 * P, -3.5 * P);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        let bodyColor = c.body;
        let wingColor = c.wing;
        if (bird.special === 'rainbow') {
          const hue = (this.frameCount * 4) % 360;
          bodyColor = `hsl(${hue}, 95%, 65%)`;
          wingColor = `hsl(${(hue + 60) % 360}, 95%, 70%)`;
        }

        // Black outline
        ctx.fillStyle = '#000000';
        ctx.fillRect(-7 * P, -5 * P, 13 * P, 10 * P);
        ctx.fillRect(-6 * P, -6 * P, 11 * P, 12 * P);
        ctx.fillRect(-8 * P, -4 * P, 15 * P, 8 * P);
        ctx.fillRect(4 * P, -1 * P, 6 * P, 5 * P);

        // Body
        ctx.fillStyle = bodyColor;
        ctx.fillRect(-6 * P, -4 * P, 11 * P, 8 * P);
        ctx.fillRect(-5 * P, -5 * P, 9 * P, 10 * P);

        // Top back specular pixel highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.fillRect(-4 * P, -5 * P, 6 * P, 1.5 * P);

        // Dark Shade
        ctx.fillStyle = c.bodyDark;
        ctx.fillRect(-5 * P, 2 * P, 9 * P, 2 * P);
        ctx.fillRect(-4 * P, 4 * P, 7 * P, 1 * P);

        // Belly
        ctx.fillStyle = c.belly;
        ctx.fillRect(-4 * P, 1 * P, 5 * P, 3 * P);

        // Cheek
        ctx.fillStyle = c.cheek;
        ctx.fillRect(1 * P, 1 * P, 2 * P, 2 * P);

        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(2 * P, -4 * P, 4 * P, 4 * P);
        ctx.fillStyle = '#000000';
        ctx.strokeRect(2 * P - 0.5, -4 * P - 0.5, 4 * P + 1, 4 * P + 1);

        ctx.fillStyle = c.eyePupil;
        ctx.fillRect(4 * P, -3 * P, 2 * P, 2 * P);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(4 * P, -4 * P, 1 * P, 1 * P);

        // Beak
        ctx.fillStyle = c.beak;
        ctx.fillRect(5 * P, 0 * P, 4 * P, 3 * P);
        ctx.fillStyle = c.beakDark;
        ctx.fillRect(5 * P, 2 * P, 4 * P, 1 * P);
        ctx.fillStyle = '#000000';
        ctx.fillRect(9 * P, 1 * P, 1 * P, 2 * P);

        // Multi-pose Animated Pixel Wing
        ctx.save();
        const wingYOffset = Math.floor(wingPhase * 2.6 * P);
        ctx.translate(-3 * P, wingYOffset);
        ctx.fillStyle = '#000000';
        ctx.fillRect(-4.5 * P, -2 * P, 6.5 * P, 5 * P);
        ctx.fillStyle = wingColor;
        ctx.fillRect(-3.5 * P, -1 * P, 4.5 * P, 3 * P);
        ctx.fillStyle = c.wingDark;
        ctx.fillRect(-3.5 * P, 1 * P, 4.5 * P, 1 * P);
        ctx.restore();

        // Bird Inherent Traits (when no overlapping hat covers the top, render freely; always render subtle traits)
        if (bird.special === 'crown' && !eq.hat) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-2 * P, -8 * P, 6 * P, 4 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-1 * P, -7 * P, 4 * P, 3 * P);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(0 * P, -6 * P, 2 * P, 1 * P);
        } else if (bird.special === 'headband' && !eq.light) {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-6 * P, -4 * P, 10 * P, 2 * P);
          ctx.fillRect(-8 * P, -3 * P + Math.sin(this.frameCount * 0.3) * 2, 3 * P, 2 * P);
        } else if (bird.special === 'visor' && !eq.eyes) {
          ctx.fillStyle = '#00ffff';
          ctx.fillRect(2 * P, -4 * P, 5 * P, 2 * P);
        } else if (bird.special === 'shades' && !eq.eyes) {
          ctx.fillStyle = '#09090b';
          ctx.fillRect(1 * P, -4 * P, 6 * P, 2.5 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(2 * P, -3.5 * P, 1.5 * P, 1 * P);
        } else if (bird.special === 'cat' && !eq.hat) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5 * P, -8 * P, 3 * P, 3 * P);
          ctx.fillRect(1 * P, -8 * P, 3 * P, 3 * P);
          ctx.fillStyle = c.body;
          ctx.fillRect(-4.5 * P, -7 * P, 2 * P, 2 * P);
          ctx.fillRect(1.5 * P, -7 * P, 2 * P, 2 * P);
        } else if (bird.special === 'bolts' && !eq.hat) {
          ctx.fillStyle = '#fde047';
          ctx.fillRect(-4 * P, -8 * P, 2 * P, 3 * P);
          ctx.fillRect(-3 * P, -9 * P, 2 * P, 2 * P);
          ctx.fillRect(1 * P, -8 * P, 2 * P, 3 * P);
        } else if (bird.special === 'halo') {
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-4 * P, -10.5 * P, 8 * P, 1.8 * P);
        } else if (bird.special === 'ninja' && !eq.light) {
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-6 * P, -4.5 * P, 10 * P, 2 * P);
          ctx.fillRect(-9 * P, -3.5 * P + Math.sin(this.frameCount * 0.35) * 2, 3 * P, 2 * P);
        } else if (bird.special === 'samurai' && !eq.hat) {
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-5 * P, -7.5 * P, 9 * P, 2 * P);
          ctx.fillRect(-1 * P, -9 * P, 2 * P, 3 * P);
        } else if (bird.special === 'frost' && !eq.hat) {
          ctx.fillStyle = '#bae6fd';
          ctx.fillRect(-2 * P, -8.5 * P, 3 * P, 3 * P);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-4 * P, -7 * P, 2 * P, 2 * P);
          ctx.fillRect(1 * P, -7 * P, 2 * P, 2 * P);
        } else if (bird.special === 'wings_angel') {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.fillRect(-8 * P, -6 * P, 4 * P, 3 * P);
          ctx.fillRect(-3 * P, -9 * P, 6 * P, 1.5 * P);
        } else if (bird.special === 'galaxy') {
          ctx.fillStyle = '#fef08a';
          const sx = Math.cos(this.frameCount * 0.12) * 8 * P;
          const sy = Math.sin(this.frameCount * 0.12) * 6 * P;
          ctx.fillRect(sx, sy, 2, 2);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-sx, -sy, 2, 2);
        } else if (bird.special === 'wizard' && !eq.hat) {
          ctx.fillStyle = '#6d28d9';
          ctx.fillRect(-5 * P, -6.5 * P, 9 * P, 2 * P);
          ctx.fillRect(-3 * P, -9.5 * P, 5 * P, 3 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-3 * P, -7.5 * P, 5 * P, 1 * P);
        } else if (bird.special === 'mario_cap' && !eq.hat) {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-5 * P, -7 * P, 10 * P, 3 * P);
          ctx.fillRect(3 * P, -5.5 * P, 4 * P, 1.5 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-1 * P, -6.5 * P, 3 * P, 2 * P);
        } else if (bird.special === 'flame' && !eq.hat) {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-4 * P, -7 * P, 3 * P, 3 * P);
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(-3 * P, -8 * P, 2 * P, 2 * P);
        } else if (bird.special === 'duck' && !eq.hat) {
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(-2 * P, -7 * P, 5 * P, 2 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-1 * P, -8 * P, 3 * P, 2 * P);
        } else if (bird.special === 'horns' && !eq.hat) {
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(-4 * P, -7 * P, 2 * P, 3 * P);
          ctx.fillRect(-2 * P, -6 * P, 2 * P, 2 * P);
        } else if (bird.special === 'crest' && !eq.hat) {
          ctx.fillStyle = c.bodyDark;
          ctx.fillRect(-4 * P, -7 * P, 3 * P, 3 * P);
        } else if (bird.special === 'ghost') {
          ctx.fillStyle = 'rgba(237, 233, 254, 0.4)';
          ctx.fillRect(-8 * P, -6 * P, 15 * P, 12 * P);
        } else if (bird.special === 'rainbow') {
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-3 * P, -10.5 * P, 7 * P, 1.5 * P);
        }

        // ======================== EQUIPPED SHOP ITEMS ========================
        // 1. EYEWEAR / MASK SLOT (Sunglasses, Eyeglasses, Black Mask, Cyber Visor)
        if (eq.eyes === 'sunglasses') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(0.5 * P, -4.5 * P, 6.2 * P, 3.2 * P);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(1 * P, -4 * P, 5.2 * P, 2.2 * P);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(1.5 * P, -3.5 * P, 1.8 * P, 1 * P);
        } else if (eq.eyes === 'glasses') {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(1 * P, -4.6 * P, 5.6 * P, 4.4 * P);
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(1.6 * P, -4 * P, 4.4 * P, 3.2 * P);
          ctx.fillStyle = '#000000';
          ctx.fillRect(3.6 * P, -3.2 * P, 1.6 * P, 1.8 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(1.8 * P, -3.8 * P, 1.2 * P, 1.2 * P);
        } else if (eq.eyes === 'black_mask') {
          ctx.fillStyle = '#09090b';
          ctx.fillRect(-6 * P, -4.8 * P, 12.5 * P, 3.8 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(2.6 * P, -3.8 * P, 3 * P, 2.2 * P);
          ctx.fillStyle = '#18181b';
          ctx.fillRect(4 * P, -3.4 * P, 1.5 * P, 1.5 * P);
        } else if (eq.eyes === 'golden_visor') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-0.5 * P, -4.8 * P, 7.2 * P, 3.4 * P);
          ctx.fillStyle = '#22d3ee';
          ctx.fillRect(0.2 * P, -4.2 * P, 6 * P, 2.2 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-5.5 * P, -3.8 * P, 5.5 * P, 1.4 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(1.5 * P, -3.9 * P, 2 * P, 0.9 * P);
        }

        // 2. HEADLAMP / SUPER TORCH SLOT
        if (eq.light === 'headlamp') {
          ctx.fillStyle = '#475569';
          ctx.fillRect(-5.5 * P, -5.8 * P, 9 * P, 1.5 * P);
          ctx.fillStyle = '#000000';
          ctx.fillRect(2 * P, -7.2 * P, 4.5 * P, 3.5 * P);
          ctx.fillStyle = '#94a3b8';
          ctx.fillRect(2.5 * P, -6.7 * P, 3 * P, 2.5 * P);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(5 * P, -6.4 * P, 2 * P, 2 * P);
        } else if (eq.light === 'laser_goggles') {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-5.8 * P, -5.4 * P, 11.5 * P, 2.6 * P);
          ctx.fillStyle = '#000000';
          ctx.fillRect(1 * P, -6.6 * P, 5.6 * P, 4.2 * P);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(2 * P, -5.6 * P, 4 * P, 2.2 * P);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(5.2 * P, -5.2 * P, 2.2 * P, 1.5 * P);
        }

        // 3. HATS SLOT (Mario Cap, Scout Cap, Cozy Beanie, Cowboy Hat, Wizard Hat, Viking Helmet, Royal Crown, Dragon Helm, Emperor Crown)
        if (eq.hat === 'mario_cap') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5.5 * P, -8.8 * P, 10.5 * P, 4 * P);
          ctx.fillRect(2 * P, -6.5 * P, 6 * P, 2 * P);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-5 * P, -8.3 * P, 9.5 * P, 3 * P);
          ctx.fillRect(2.5 * P, -6 * P, 5 * P, 1.3 * P);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-1 * P, -7.8 * P, 3.2 * P, 2.2 * P);
        } else if (eq.hat === 'scout_cap') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5.5 * P, -8.6 * P, 10 * P, 3.8 * P);
          ctx.fillRect(2 * P, -6.4 * P, 6 * P, 1.8 * P);
          ctx.fillStyle = '#16a34a';
          ctx.fillRect(-5 * P, -8.1 * P, 9 * P, 2.8 * P);
          ctx.fillRect(2.5 * P, -6 * P, 5 * P, 1.2 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-1 * P, -7.6 * P, 2.5 * P, 1.8 * P);
        } else if (eq.hat === 'beanie') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5.5 * P, -9.2 * P, 9.5 * P, 4.5 * P);
          ctx.fillRect(-2 * P, -11.2 * P, 3.2 * P, 2.2 * P);
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(-5 * P, -8.7 * P, 8.5 * P, 2.6 * P);
          ctx.fillStyle = '#fef3c7';
          ctx.fillRect(-5 * P, -6.3 * P, 8.5 * P, 1.5 * P);
          ctx.fillRect(-1.5 * P, -10.8 * P, 2.2 * P, 1.6 * P);
        } else if (eq.hat === 'cowboy_hat') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-8 * P, -6.8 * P, 15.5 * P, 2.2 * P);
          ctx.fillRect(-4.5 * P, -10.2 * P, 8.5 * P, 4 * P);
          ctx.fillStyle = '#92400e';
          ctx.fillRect(-7.5 * P, -6.4 * P, 14.5 * P, 1.4 * P);
          ctx.fillRect(-4 * P, -9.7 * P, 7.5 * P, 3.3 * P);
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(-4 * P, -7.2 * P, 7.5 * P, 1 * P);
        } else if (eq.hat === 'wizard_hat') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-7 * P, -6.8 * P, 13 * P, 2 * P);
          ctx.fillRect(-4 * P, -10.5 * P, 7 * P, 4 * P);
          ctx.fillRect(-2.5 * P, -13 * P, 4 * P, 3 * P);
          ctx.fillStyle = '#6d28d9';
          ctx.fillRect(-6.5 * P, -6.4 * P, 12 * P, 1.3 * P);
          ctx.fillRect(-3.5 * P, -10 * P, 6 * P, 3.6 * P);
          ctx.fillRect(-2 * P, -12.4 * P, 3 * P, 2.6 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-3.5 * P, -7.6 * P, 6 * P, 1 * P);
        } else if (eq.hat === 'viking_hat') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5.5 * P, -9 * P, 10 * P, 4.2 * P);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(-5 * P, -8.5 * P, 9 * P, 3.2 * P);
          ctx.fillStyle = '#fef3c7';
          ctx.fillRect(-7.5 * P, -10.5 * P, 2.4 * P, 3.8 * P);
          ctx.fillRect(3.5 * P, -10.5 * P, 2.4 * P, 3.8 * P);
        } else if (eq.hat === 'royal_crown') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-4.5 * P, -9.8 * P, 8.5 * P, 5 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-4 * P, -7.8 * P, 7.5 * P, 2.6 * P);
          ctx.fillRect(-4 * P, -9.4 * P, 1.8 * P, 2 * P);
          ctx.fillRect(-1.2 * P, -10.2 * P, 2 * P, 2.8 * P);
          ctx.fillRect(1.7 * P, -9.4 * P, 1.8 * P, 2 * P);
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-1 * P, -7.2 * P, 1.6 * P, 1.4 * P);
        } else if (eq.hat === 'dragon_helm') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-6 * P, -9.2 * P, 11.5 * P, 4.5 * P);
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(-5.5 * P, -8.6 * P, 10.5 * P, 3.4 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-7.5 * P, -11.5 * P, 2.4 * P, 3.5 * P);
          ctx.fillRect(2 * P, -11.5 * P, 2.4 * P, 3.5 * P);
          ctx.fillStyle = '#f97316';
          ctx.fillRect(-1.5 * P, -9.5 * P, 3 * P, 1.8 * P);
        } else if (eq.hat === 'starlight_crown') {
          ctx.fillStyle = '#000000';
          ctx.fillRect(-5.5 * P, -10.6 * P, 10.5 * P, 5.6 * P);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-5 * P, -8.2 * P, 9.5 * P, 2.8 * P);
          ctx.fillRect(-5 * P, -10.2 * P, 2 * P, 2.4 * P);
          ctx.fillRect(-1.5 * P, -11.2 * P, 2.6 * P, 3.2 * P);
          ctx.fillRect(2.5 * P, -10.2 * P, 2 * P, 2.4 * P);
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(-1 * P, -7.6 * P, 1.8 * P, 1.6 * P);
          ctx.fillStyle = '#4ade80';
          ctx.fillRect(-4 * P, -7.6 * P, 1.4 * P, 1.4 * P);
          ctx.fillRect(2.6 * P, -7.6 * P, 1.4 * P, 1.4 * P);
        }

        // 4. AURA SLOT (Angel Halo, Phoenix Aura, Galaxy Orbit)
        if (eq.aura === 'halo_ring') {
          const floatY = Math.sin(this.frameCount * 0.12) * 0.8 * P;
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-4.5 * P, -12.2 * P + floatY, 8.5 * P, 1.8 * P);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-3.5 * P, -11.9 * P + floatY, 6.5 * P, 0.9 * P);
        } else if (eq.aura === 'phoenix_aura') {
          ctx.save();
          const pulse = 0.28 + Math.sin(this.frameCount * 0.2) * 0.1;
          ctx.strokeStyle = `rgba(249, 115, 22, ${pulse + 0.45})`;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(0, 0, 9.6 * P, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#facc15';
          for (let k = 0; k < 4; k++) {
            const ang = this.frameCount * 0.14 + (k * Math.PI) / 2;
            ctx.fillRect(Math.cos(ang) * 9.5 * P - 1.5, Math.sin(ang) * 9.5 * P - 1.5, 3, 3);
          }
          ctx.restore();
        } else if (eq.aura === 'galaxy_orb') {
          ctx.save();
          for (let k = 0; k < 3; k++) {
            const ang = this.frameCount * 0.09 + (k * Math.PI * 2) / 3;
            const ox = Math.cos(ang) * 10.2 * P;
            const oy = Math.sin(ang) * 8.2 * P;
            ctx.fillStyle = k === 0 ? '#38bdf8' : (k === 1 ? '#c084fc' : '#facc15');
            ctx.fillRect(ox - 2.2, oy - 2.2, 4.4, 4.4);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(ox - 0.8, oy - 0.8, 1.6, 1.6);
          }
          ctx.restore();
        }

        // 5. DEFENSE SHIELD BUBBLE (1-hit Defense Shield or 2-hit Golden Aegis Shield)
        if ((eq.defense === 'shield' || eq.defense === 'golden_shield') &&
            (this.currentState !== STATE.PLAYING || this.shieldHits > 0)) {
          ctx.save();
          const isGold = (eq.defense === 'golden_shield');
          const pulse = 0.22 + Math.sin(this.frameCount * 0.14) * 0.08;
          ctx.fillStyle = isGold ? `rgba(250, 204, 21, ${pulse})` : `rgba(56, 189, 248, ${pulse})`;
          ctx.beginPath();
          ctx.arc(0, 0, 10.6 * P, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = isGold ? '#facc15' : '#7dd3fc';
          ctx.lineWidth = isGold ? 2.5 : 2;
          ctx.stroke();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.fillRect(-5 * P, -7 * P, 2.5 * P, 1.5 * P);
          ctx.restore();
        }

        ctx.restore();
      }

      renderPixelGround(ctx, theme) {
        ctx.save();
        const gY = PLAYABLE_FLOOR;
        const gH = CONFIG.GROUND_HEIGHT;

        const bodyColor = theme.groundDirt || '#142036';
        ctx.fillStyle = bodyColor;
        ctx.fillRect(0, gY, V_WIDTH, gH);

        const topBarColor = theme.groundTop || '#334155';
        ctx.fillStyle = topBarColor;
        ctx.fillRect(0, gY, V_WIDTH, 5);

        if (theme.groundHighlight) {
          ctx.fillStyle = theme.groundHighlight;
          const trimOff = Math.floor(this.groundOffset) % 8;
          for (let gx = -8; gx < V_WIDTH + 8; gx += 8) {
            ctx.fillRect(gx - trimOff, gY, 4, 2);
          }
        }

        const patternColor = theme.groundDirtDark || '#0b111e';
        ctx.fillStyle = patternColor;
        for (let row = 0; row < 6; row++) {
          const rowY = gY + 16 + row * 16;
          const shift = (row % 2) * 16;
          for (let x = -32; x < V_WIDTH + 32; x += 32) {
            const drawX = Math.floor(x + shift - this.groundOffset);
            ctx.fillRect(drawX, rowY, 20, 3);
            ctx.fillRect(drawX + 8, rowY + 3, 3, 9);
          }
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fillRect(0, gY, V_WIDTH, 1.5);

        ctx.restore();
      }

      renderParticles(ctx) {
        ctx.save();
        for (const pt of this.particles) {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.alpha);
          ctx.fillRect(Math.floor(pt.x), Math.floor(pt.y), pt.size, pt.size);
        }
        ctx.restore();
      }

      renderFloatingTexts(ctx) {
        ctx.save();
        for (const ft of this.floatingTexts) {
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.font = '900 20px "Courier New", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 4;
          ctx.textAlign = 'center';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.restore();
      }

      renderConfetti(ctx) {
        ctx.save();
        for (const c of this.confetti) {
          ctx.save();
          ctx.translate(Math.floor(c.x), Math.floor(c.y));
          ctx.rotate((c.rotation * Math.PI) / 180);
          ctx.globalAlpha = Math.max(0, c.alpha);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size);
          ctx.restore();
        }
        ctx.restore();
      }

      renderHUD(ctx, theme) {
        if (this.currentState === STATE.START) {
          this.renderStartScreen(ctx);
        } else if (this.currentState === STATE.PLAYING) {
          this.renderLiveScore(ctx);
        } else if (this.currentState === STATE.GAMEOVER) {
          this.renderGameOverScreen(ctx);
        } else if (this.currentState === STATE.LEVEL_CLEARED) {
          this.renderLevelClearedScreen(ctx);
        } else if (this.currentState === STATE.CINEMATIC_END) {
          this.renderCinematicEndScreen(ctx);
        }
      }

      drawPixelCoinIcon(ctx, cx, cy, size = 14) {
        const s = Math.round(size);
        const half = Math.floor(s / 2);
        ctx.save();
        ctx.fillStyle = '#000000';
        ctx.fillRect(cx - half - 1, cy - half, s + 2, s);
        ctx.fillRect(cx - half, cy - half - 1, s, s + 2);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(cx - half, cy - half, s, s);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(cx - half + 1, cy - half + 1, Math.max(2, Math.floor(s * 0.35)), s - 2);
        ctx.fillStyle = '#b45309';
        ctx.fillRect(cx - 1, cy - half + 2, 2, Math.max(2, s - 4));
        ctx.restore();
      }

      drawPixelGearIcon(ctx, cx, cy) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#ffffff';
        // 8 pixel gear teeth (cardinal + diagonal)
        ctx.fillRect(-2, -10, 4, 20);
        ctx.fillRect(-10, -2, 20, 4);
        ctx.fillRect(-7, -7, 14, 14);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-3, -3, 6, 6);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-1.5, -1.5, 3, 3);
        ctx.restore();
      }

      /**
       * Start Screen
       */
      renderStartScreen(ctx) {
        ctx.save();

        // 1. Top-Left Coin Emblem Badge
        const cb = this.buttons.coinsBadge;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(cb.x, cb.y, cb.width, cb.height);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.2;
        ctx.strokeRect(cb.x, cb.y, cb.width, cb.height);
        this.drawPixelCoinIcon(ctx, cb.x + 16, cb.y + 16, 13);
        ctx.font = '900 12px "Courier New", monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'left';
        ctx.fillText(`${this.coins}`, cb.x + 30, cb.y + 20);

        // 2. Small Free Coins Rewarded Ad Box right beside Coins (+10 coins, 12h cooldown)
        const fcab = this.buttons.freeCoinsAdBtn;
        const remMs = this.getFreeCoinsAdRemainingMs();
        const adReady = (remMs <= 0);
        ctx.fillStyle = adReady ? 'rgba(22, 163, 74, 0.9)' : 'rgba(15, 23, 42, 0.78)';
        ctx.fillRect(fcab.x, fcab.y, fcab.width, fcab.height);
        ctx.strokeStyle = adReady ? '#fde047' : '#64748b';
        ctx.lineWidth = 2;
        ctx.strokeRect(fcab.x, fcab.y, fcab.width, fcab.height);
        if (adReady) {
          this.drawPixelCoinIcon(ctx, fcab.x + 14, fcab.y + 16, 11);
          ctx.font = '900 11px "Courier New", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'left';
          ctx.fillText('+10 AD', fcab.x + 24, fcab.y + 20);
        } else {
          ctx.font = '900 9px "Courier New", monospace';
          ctx.fillStyle = '#94a3b8';
          ctx.textAlign = 'center';
          ctx.fillText('WAIT AD', fcab.x + fcab.width / 2, fcab.y + 13);
          ctx.fillStyle = '#fde047';
          ctx.fillText(this.formatCooldown(remMs), fcab.x + fcab.width / 2, fcab.y + 25);
        }

        // 3. Top-Right Box: Settings Gear Icon (Volume & Privacy Policy)
        const sb = this.buttons.settingsBox;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
        ctx.fillRect(sb.x, sb.y, sb.width, sb.height);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(sb.x, sb.y, sb.width, sb.height);
        this.drawPixelGearIcon(ctx, sb.x + sb.width / 2, sb.y + sb.height / 2);

        // 4. Giant Title: "Tap to fly"
        ctx.textAlign = 'center';
        const titleY = 142;
        ctx.font = '900 46px "Courier New", monospace';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 10;
        ctx.strokeText('Tap to fly', V_WIDTH / 2, titleY);

        ctx.fillStyle = '#f5b53f';
        ctx.fillText('Tap to fly', V_WIDTH / 2, titleY);

        // 5. Mode Selector Tabs: [ CASUAL ] [ LEVELS ]
        const bCas = this.buttons.modeCasual;
        const bLvl = this.buttons.modeLevels;
        const isCas = this.gameMode === 'casual';

        // CASUAL Tab
        if (isCas) {
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(bCas.x, bCas.y, bCas.width, bCas.height);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.strokeRect(bCas.x, bCas.y, bCas.width, bCas.height);
          ctx.fillStyle = '#ffffff';
        } else {
          ctx.fillStyle = 'rgba(25, 36, 56, 0.6)';
          ctx.fillRect(bCas.x, bCas.y, bCas.width, bCas.height);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          ctx.strokeRect(bCas.x, bCas.y, bCas.width, bCas.height);
          ctx.fillStyle = '#64748b';
        }
        ctx.font = '900 13px "Courier New", monospace';
        ctx.fillText('CASUAL', bCas.x + bCas.width / 2, bCas.y + 24);

        // LEVELS Tab
        if (!isCas) {
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(bLvl.x, bLvl.y, bLvl.width, bLvl.height);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.strokeRect(bLvl.x, bLvl.y, bLvl.width, bLvl.height);
          ctx.fillStyle = '#ffffff';
        } else {
          ctx.fillStyle = 'rgba(25, 36, 56, 0.6)';
          ctx.fillRect(bLvl.x, bLvl.y, bLvl.width, bLvl.height);
          ctx.strokeStyle = '#334155';
          ctx.lineWidth = 2;
          ctx.strokeRect(bLvl.x, bLvl.y, bLvl.width, bLvl.height);
          ctx.fillStyle = '#64748b';
        }
        ctx.fillText('LEVELS', bLvl.x + bLvl.width / 2, bLvl.y + 24);

        // Stage Selector (Levels — locked until all 100 stages are completed!) or Casual Best
        if (!isCas) {
          const curSt = this.getCurrentStage();
          const ssb = this.buttons.stageSelectBtn;
          if (this.levelsCompleted) {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
            ctx.fillRect(ssb.x, ssb.y, ssb.width, ssb.height);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(ssb.x, ssb.y, ssb.width, ssb.height);

            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(`STAGE ${curSt.id} / 100 ➔`, V_WIDTH / 2, ssb.y + 17);
          } else {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
            ctx.fillRect(ssb.x, ssb.y, ssb.width, ssb.height);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(ssb.x, ssb.y, ssb.width, ssb.height);

            ctx.font = 'bold 12px "Courier New", monospace';

      /**
       * Casual Mode 1000-Point Joyful Celebrations Victory Screen
       */
      renderCasualWinScreen(ctx) {
        ctx.save();

        const winGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
        winGrad.addColorStop(0, '#0ea5e9');
        winGrad.addColorStop(0.55, '#38bdf8');
        winGrad.addColorStop(1, '#fef08a');
        ctx.fillStyle = winGrad;
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        ctx.save();
        ctx.translate(V_WIDTH / 2, 235);
        for (let i = 0; i < 12; i++) {
          const ang = (i * Math.PI * 2) / 12 + this.frameCount * 0.012;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(ang - 0.1) * 360, Math.sin(ang - 0.1) * 360);
          ctx.lineTo(Math.cos(ang + 0.1) * 360, Math.sin(ang + 0.1) * 360);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        const fwCenters = [
          { x: 75, y: 110, col: '#ef4444', phase: 0 },
          { x: 285, y: 120, col: '#facc15', phase: 22 },
          { x: 180, y: 80, col: '#22c55e', phase: 44 }
        ];
        for (const fw of fwCenters) {
          const t = ((this.frameCount + fw.phase) % 66) / 66;
          const rad = 8 + t * 44;
          ctx.globalAlpha = Math.max(0, 1 - t);
          ctx.fillStyle = fw.col;
          for (let k = 0; k < 10; k++) {
            const a = (k * Math.PI * 2) / 10;
            ctx.fillRect(Math.floor(fw.x + Math.cos(a) * rad), Math.floor(fw.y + Math.sin(a) * rad), 4, 4);
          }
        }
        ctx.globalAlpha = 1;

        const tx = V_WIDTH / 2;
        const ty = 135;
        ctx.fillStyle = '#000000';
        ctx.fillRect(tx - 24, ty - 22, 48, 28);
        ctx.fillRect(tx - 6, ty + 6, 12, 16);
        ctx.fillRect(tx - 18, ty + 20, 36, 10);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(tx - 21, ty - 19, 42, 22);
        ctx.fillRect(tx - 4, ty + 6, 8, 14);
        ctx.fillStyle = '#ca8a04';
        ctx.fillRect(tx - 15, ty + 22, 30, 6);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(tx - 16, ty - 16, 8, 14);

        const bounceY = 232 - Math.abs(Math.sin(this.frameCount * 0.14)) * 18;
        const curBird = this.getSelectedBird();
        this.renderPixelBird(ctx, V_WIDTH / 2, bounceY, -0.1, Math.sin(this.frameCount * 0.35), curBird, 1.35, 1.35, true);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(32, 284, V_WIDTH - 64, 140);
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 4;
        ctx.strokeRect(32, 284, V_WIDTH - 64, 140);

        ctx.textAlign = 'center';
        ctx.font = '900 32px "Courier New", monospace';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        ctx.strokeText('YOU WIN!', V_WIDTH / 2, 326);
        ctx.fillStyle = '#22c55e';
        ctx.fillText('YOU WIN!', V_WIDTH / 2, 326);

        ctx.font = '900 13px "Courier New", monospace';
        ctx.fillStyle = '#0f172a';
        ctx.fillText('CASUAL 1000 CHAMPION!', V_WIDTH / 2, 354);

        ctx.font = '900 16px "Courier New", monospace';
        ctx.fillStyle = '#ca8a04';
        ctx.fillText('+100 COINS REWARDED!', V_WIDTH / 2, 384);

        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.fillStyle = '#475569';
        ctx.fillText(`TOTAL COINS: ${this.coins}`, V_WIDTH / 2, 408);

        const cwBtn = this.buttons.menuInCasualWin;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(cwBtn.x, cwBtn.y, cwBtn.width, cwBtn.height);
